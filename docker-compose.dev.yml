# KLA Workstation 本地开发依赖编排：PostgreSQL / Redis
# 用法：docker compose -f docker-compose.dev.yml up -d
# 说明：对象存储当前为服务端本地文件系统适配器（.runtime/object-storage），
#       不依赖 MinIO；S3/MinIO 适配器落地后再回补本编排。

services:
  postgres:
    image: postgres:16-alpine
    container_name: kla-dev-postgres
    environment:
      POSTGRES_USER: kla
      POSTGRES_PASSWORD: kla
      POSTGRES_DB: kla
    ports:
      - "5432:5432"
    volumes:
      - kla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kla -d kla"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kla-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - kla-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kla-pgdata:
  kla-redisdata:
