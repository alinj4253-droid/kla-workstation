# KLA Workstation 本地开发依赖编排：PostgreSQL / Redis / MinIO
# 用法：docker compose -f docker-compose.dev.yml up -d
# 凭据与 server/.env.example 对齐；MinIO 凭据对应 OBJECT_STORAGE_ACCESS_KEY / OBJECT_STORAGE_SECRET_KEY
# 说明：服务端当前为内存占位实现，本编排用于 M0 起各并行组提前就绪，不阻塞现有开发。

services:
  postgres:
    image: postgres:16-alpine
    container_name: kla-dev-postgres
    environment:
      POSTGRES_USER: kla
      POSTGRES_PASSWORD: kla
      POSTGRES_DB: kla
    ports:
      - "5432:5432"
    volumes:
      - kla-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kla -d kla"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: kla-dev-redis
    ports:
      - "6379:6379"
    volumes:
      - kla-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: kla-dev-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kla-dev
      MINIO_ROOT_PASSWORD: kla-dev-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kla-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: kla-dev-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 kla-dev kla-dev-secret &&
      mc mb --ignore-existing local/kla-workstation &&
      echo 'bucket kla-workstation ready'
      "

volumes:
  kla-pgdata:
  kla-redisdata:
  kla-miniodata:
