# KLA Workstation CI：代码检查（typecheck + lint + test + build）与服务端镜像打包。
# 约定：
# - check 阶段等价于本地 `pnpm ci-check`，任何合入前必须通过。
# - package:server 仅构建服务端镜像做冒烟验证，不推送到镜像仓库。

stages:
  - check
  - package

variables:
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

default:
  image: node:22-alpine
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.9.0 --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

check:
  stage: check
  script:
    - pnpm ci-check

package:server:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  cache: []
  before_script: []
  script:
    - docker build -t "$CI_REGISTRY_IMAGE/server:$CI_COMMIT_SHORT_SHA" .
