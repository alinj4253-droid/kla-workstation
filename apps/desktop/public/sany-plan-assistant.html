<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三一规划助手 · 配置端 / 填写端 / 智能体生成</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --p:#185FA5; --p-h:#134b82; --p-l:#E6F1FB; --p-l2:#F4F9FF;
  --red:#A32D2D; --red-l:#FCEBEB; --brand:#C00000;
  --green:#0F6E56; --green-l:#E1F5EE;
  --amber:#854F0B; --amber-l:#FAEEDA;
  --purple:#5B3FA8; --purple-l:#F0ECFB;
  --t1:#1F2329; --t2:#4E5969; --t3:#86909C; --t4:#C9CDD4;
  --bd:#E5E6EB; --bd2:#F2F3F5;
  --bg:#F5F7FA; --w:#fff;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
body{font-family:"Microsoft YaHei","PingFang SC",-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--t1);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input,select,textarea{outline:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#D5D8DD;border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* ============ TOP ============ */
.top{height:56px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;
  padding:0 20px;gap:22px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand .mk{width:26px;height:26px;border-radius:6px;background:linear-gradient(135deg,#C00000,#8E1B1B);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;letter-spacing:0}
.brand small{font-weight:400;font-size:11px;color:var(--t3);padding-left:4px;border-left:1px solid var(--bd);margin-left:4px}
.switch{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:2px}
.switch button{padding:5px 15px;border-radius:6px;font-size:12.5px;color:var(--t2);transition:.15s;white-space:nowrap}
.switch button.on{background:#fff;color:var(--p);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:12px;color:var(--t3)}
.role-chip{display:flex;align-items:center;gap:6px;background:var(--bg);padding:4px 10px;border-radius:20px;color:var(--t2);white-space:nowrap}
.role-chip i{width:6px;height:6px;border-radius:50%;background:var(--p);display:inline-block}
.role-chip.admin i{background:var(--amber)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--p-l);color:var(--p);display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:600}

/* ============ LAYOUT ============ */
.layout{display:flex;min-height:calc(100vh - 56px)}
.side{width:252px;background:#fff;border-right:1px solid var(--bd);padding:14px 10px 40px;flex-shrink:0;
  position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto}
.side .grp{font-size:11px;color:var(--t4);padding:12px 10px 6px;letter-spacing:.06em;font-weight:600}
.side .grp:first-child{padding-top:2px}
.side a{display:grid;grid-template-columns:17px 1fr auto;align-items:center;column-gap:7px;
  padding:8px 10px;border-radius:6px;color:var(--t2);text-decoration:none;font-size:12.5px;
  line-height:1.42;margin-bottom:1px;cursor:pointer;transition:.12s}
.side a:hover{background:var(--bg)}
.side a.on{background:var(--p-l);color:var(--p);font-weight:600}
.side a .no{display:flex;align-items:center;justify-content:center;width:17px;height:17px;
  border-radius:4px;background:var(--bd2);color:var(--t3);font-size:10.5px;font-weight:600}
.side a.on .no{background:var(--p);color:#fff}
.side a .no.done{background:var(--green-l);color:var(--green)}
.side a .badge{justify-self:end;font-size:10px;background:var(--red);color:#fff;padding:0 5px;
  border-radius:8px;line-height:15px;min-width:15px;text-align:center;font-weight:600}
.side a.on .badge{background:var(--p)}
.side a .st{justify-self:end;font-size:10px;color:var(--t4);white-space:nowrap}
.side a .t{min-width:0}
.side a .cnt{justify-self:end;font-size:10.5px;color:var(--t3);background:var(--bd2);
  padding:0 6px;border-radius:8px;line-height:16px;white-space:nowrap}
.side a .ic{width:14px;height:14px;opacity:.75}
.side a.on .ic{opacity:1}
.side a .st.ok{color:var(--green)}
.side a .st.part{color:var(--amber)}
.main{flex:1;padding:20px 24px 72px;min-width:0}

/* ============ HEAD / CARDS ============ */
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.phead h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px}
.phead p{font-size:12px;color:var(--t3);line-height:1.65;max-width:820px}
.phead .acts{margin-left:auto;display:flex;gap:8px;flex-shrink:0;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.card > h3{font-size:13.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.card > h3 .tag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--p-l);color:var(--p)}
.card > .hint{font-size:11.5px;color:var(--t3);margin-bottom:14px;line-height:1.7}

.btn{padding:6px 14px;border-radius:6px;border:1px solid var(--bd);background:#fff;font-size:12.5px;
  color:var(--t2);transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--p);color:var(--p)}
.btn.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn.pri:hover{background:var(--p-h);border-color:var(--p-h);color:#fff}
.btn.brand{background:linear-gradient(135deg,#C00000,#961818);border-color:#A00000;color:#fff}
.btn.brand:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--bg)}
.btn.danger{color:var(--red);border-color:#F2D5D5;background:#fff}
.btn.danger:hover{background:var(--red-l);border-color:var(--red)}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ic{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ============ TAB STRIP ============ */
.tabs{display:flex;gap:2px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:3px;
  width:fit-content;margin-bottom:16px}
.tabs button{padding:5px 16px;border-radius:6px;font-size:12.5px;color:var(--t2);transition:.15s}
.tabs button.on{background:var(--p);color:#fff;font-weight:600}

/* ============ OVERVIEW ============ */
.ov-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ov-card{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:16px 18px;position:relative;display:flex;flex-direction:column;
  transition:.15s;cursor:pointer;overflow:hidden}
.ov-card:hover{border-color:var(--p);box-shadow:var(--shadow);transform:translateY(-1px)}
.ov-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bd)}
.ov-card.ok::before{background:var(--green)}
.ov-card.part::before{background:var(--amber)}
.ov-card .num{font-size:10.5px;font-weight:700;color:var(--t4);letter-spacing:.04em;margin-bottom:6px}
.ov-card h4{font-size:13.5px;font-weight:700;margin-bottom:4px}
.ov-card .desc{font-size:11.5px;color:var(--t3);line-height:1.65;min-height:38px;flex:1}
.ov-card .foot{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;
  border-top:1px dashed var(--bd);font-size:11px;color:var(--t3)}
.ov-card .bar{flex:1;height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.ov-card .bar i{display:block;height:100%;background:var(--green);border-radius:2px;transition:.4s}
.ov-card.part .bar i{background:var(--amber)}
.ov-card .bar i.zero{background:var(--t4)}
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.stat .k{font-size:11px;color:var(--t3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
.stat .v{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.stat .v small{font-size:12px;font-weight:400;color:var(--t3);margin-left:3px;letter-spacing:0}
.stat .v.g{color:var(--green)} .stat .v.a{color:var(--amber)} .stat .v.p{color:var(--p)}

/* ============ EDIT TABLE ============ */
.edit-wrap{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.edit-bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--bd);background:#FCFCFD}
.edit-bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.tbl-scroll{overflow-x:auto;padding:0}
table.et{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px;min-width:860px}
table.et th{background:#F7F8FA;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd2);
  padding:9px 10px;font-weight:600;color:var(--t2);text-align:left;white-space:normal;line-height:1.35;
  font-size:11.5px;position:relative;vertical-align:middle}
table.et th .req{color:var(--red);margin-left:2px}
table.et th:last-child{border-right:none}
table.et td{border-bottom:1px solid var(--bd2);border-right:1px solid var(--bd2);padding:0;vertical-align:middle}
table.et td:last-child{border-right:none}
table.et tr:last-child td{border-bottom:none}
table.et td.lbl{background:#FBFCFD;font-weight:600;color:var(--t2);padding:8px 12px;white-space:nowrap}
table.et td.lbl.sub{font-weight:400;color:var(--t3);padding-left:24px;font-size:12px}
table.et input,table.et select{border:none;background:transparent;width:100%;padding:9px 10px;
  font-size:12.5px;min-width:0;border-radius:0;transition:.1s;text-overflow:ellipsis}
table.et input:focus,table.et select:focus{background:var(--p-l2);box-shadow:inset 0 0 0 1.5px var(--p)}
table.et input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
table.et textarea{border:none;background:transparent;width:100%;padding:9px 10px;font-size:12.5px;
  line-height:1.55;resize:none;min-height:56px;field-sizing:content;display:block}
table.et textarea:focus{background:var(--p-l2);box-shadow:inset 0 0 0 1.5px var(--p)}
table.et td.cell-num input{text-align:right;font-variant-numeric:tabular-nums}
table.et .auto{background:#F6FBF8 !important;color:var(--green);font-weight:600;font-variant-numeric:tabular-nums;
  padding:7px 10px;display:block;font-size:12.5px;text-align:right}
table.et .auto.blank{color:var(--t4);font-weight:400}
table.et .rowdel{color:var(--t4);padding:0 8px;font-size:15px;line-height:1;transition:.12s}
table.et .rowdel:hover{color:var(--red)}
.grp-row td{background:#F4F8FD!important}
.grp-row td.lbl{color:var(--p);font-weight:700}
.addrow{display:flex;align-items:center;gap:6px;padding:9px 14px;color:var(--p);font-size:12px;
  cursor:pointer;border-top:1px dashed var(--bd);transition:.12s;background:#fff}
.addrow:hover{background:var(--p-l2)}
.input-flat{border:1px solid var(--bd);border-radius:6px;padding:6px 10px;font-size:12.5px;width:100%;background:#fff}
.input-flat:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(24,95,165,.08)}
.muted-row{opacity:.55}
.tip{display:flex;gap:8px;background:var(--p-l2);border:1px solid #D6E6F7;border-radius:8px;
  padding:9px 12px;font-size:11.5px;color:#2B5F8F;line-height:1.7;margin-bottom:14px}
.tip.amber{background:var(--amber-l);border-color:#F0DFBE;color:#7A4A08}
.tip b{font-weight:700}
.tip .ic{margin-top:2px}

/* ============ PREVIEW (page WYSIWYG) ============ */
.pv-stage{background:#EDEFF2;border-radius:10px;padding:22px;display:flex;justify-content:center;overflow:auto}
.pv-frame{width:100%;max-width:1120px;transform-origin:top center}

/* ============ CONFIG ============ */
.cfg-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.cfg-tbl th{text-align:left;font-size:11px;color:var(--t3);font-weight:600;padding:7px 10px;
  border-bottom:1px solid var(--bd);white-space:nowrap;background:#FCFCFD}
.cfg-tbl td{padding:6px 10px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.cfg-tbl tr:last-child td{border-bottom:none}
.cfg-tbl input[type=text]{width:100%;border:1px solid transparent;border-radius:5px;padding:5px 8px;
  background:transparent;font-size:12.5px;transition:.12s}
.cfg-tbl input[type=text]:hover{border-color:var(--bd)}
.cfg-tbl input[type=text]:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(24,95,165,.08)}
.cfg-tbl input[type=checkbox]{width:14px;height:14px;accent-color:var(--p);cursor:pointer}
.pill{display:inline-flex;align-items:center;padding:1px 8px;border-radius:10px;font-size:10.5px;font-weight:600;white-space:nowrap}
.pill.blue{background:var(--p-l);color:var(--p)}
.pill.gray{background:var(--bd2);color:var(--t3)}
.pill.green{background:var(--green-l);color:var(--green)}
.pill.amber{background:var(--amber-l);color:var(--amber)}
.pill.red{background:var(--red-l);color:var(--red)}
.pill.purple{background:var(--purple-l);color:var(--purple)}
.cfg-split{display:grid;grid-template-columns:280px 1fr;gap:16px;align-items:start}
.cfg-list{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px;position:sticky;top:72px}
.cfg-list a{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:7px;font-size:12.5px;
  color:var(--t2);cursor:pointer;transition:.12s}
.cfg-list a:hover{background:var(--bg)}
.cfg-list a.on{background:var(--p-l);color:var(--p);font-weight:600}
.cfg-list a .cnt{margin-left:auto;font-size:10.5px;color:var(--t4);background:var(--bd2);
  padding:0 6px;border-radius:8px;line-height:16px}
.cfg-list a.on .cnt{background:#fff;color:var(--p)}
.dict-row{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--bd2);
  border-radius:7px;margin-bottom:6px;background:#fff;transition:.12s}
.dict-row:hover{border-color:var(--bd)}
.dict-row .drag{color:var(--t4);font-size:11px;cursor:grab}
.dict-row input{flex:1;border:none;font-size:12.5px;background:transparent;padding:2px 0}
.dict-row input:focus{box-shadow:inset 0 -1px 0 var(--p)}
.dict-row .del{color:var(--t4);font-size:14px;padding:0 4px}
.dict-row .del:hover{color:var(--red)}
.dict-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* ============ SLIDE (16:9) ============ */
.slide{width:1280px;height:720px;background:#fff;position:relative;overflow:hidden;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#1A1A1A;
  transform-origin:top left;box-shadow:0 2px 20px rgba(0,0,0,.10)}
.slide.dark{background:#0F1720}
.sd-body{position:absolute;inset:0;padding:38px 56px 18px;display:flex;flex-direction:column}
.sd-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px;flex-shrink:0}
.sd-head .bar{width:6px;height:34px;background:var(--brand);border-radius:2px;flex-shrink:0;margin-top:4px}
.sd-head h2{font-size:29px;font-weight:700;letter-spacing:-.02em;line-height:1.25;color:#111}
.sd-head .sub{font-size:13px;color:#7A828E;margin-top:5px;line-height:1.4}
.sd-head .rt{margin-left:auto;font-size:11.5px;color:#A5ADBA;text-align:right;line-height:1.6;flex-shrink:0;padding-top:4px}
.sd-foot{display:flex;align-items:center;flex-shrink:0;margin-top:auto;
  font-size:10.5px;color:#B4BAC4;border-top:1px solid #EEF0F3;padding-top:9px}
.sd-foot .r{margin-left:auto;font-variant-numeric:tabular-nums}
.sd-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.sd-main>.fit{flex-shrink:0}

/* slide table base */
.st{border-collapse:collapse;width:100%;table-layout:fixed;font-size:14px}
.st th,.st td{border:1px solid #B9CDE8;padding:0;vertical-align:middle}
.st th{background:#2F5597;color:#fff;font-weight:700;text-align:center;font-size:14px;height:44px;line-height:1.25}
.st th.lv2{background:#3A6BB0;font-size:13px;height:38px;font-weight:600}
.st th.rowh{background:#2F5597;font-size:14px}
.st td{height:52px;text-align:center;font-size:14px;background:#fff;font-variant-numeric:tabular-nums}
.st td.rowlab{background:#EEF4FB;font-weight:600;color:#22303F;text-align:left;padding:0 14px;font-size:14px}
.st td.rowlab.sub{padding-left:30px;font-weight:400;color:#3D4A5C}
.st td.sub-total{background:#F7FAFE;font-weight:600}
.st .unit{font-size:11px;font-weight:400;opacity:.8;display:block;line-height:1.2;margin-top:1px}
.st-hint{font-size:11.5px;color:#98A2B3;margin-top:10px;display:flex;justify-content:space-between}

/* slide 3 : dark red */
.st-red th{background:#9E2A1E;border-color:#B4483B}
.st-red td{border-color:#DCC3C0}
.st-red th.lv2{background:#B43A2C}

/* slide 4 : tree */
.tree{display:flex;flex-direction:column;gap:0}
.tr-init{background:#9E2A1E;color:#fff;border-radius:5px;padding:10px 18px;font-size:15px;font-weight:700;
  display:flex;align-items:center;gap:10px}
.tr-init .goal{font-size:12px;font-weight:400;opacity:.85;margin-left:auto}
.tr-battle{margin:12px 0 0 26px;position:relative;border-left:2px solid #E2B9B3;padding-left:18px}
.tr-battle::before{content:'';position:absolute;left:-2px;top:16px;width:16px;height:2px;background:#E2B9B3}
.tr-bhead{background:#B43A2C;color:#fff;border-radius:4px;padding:7px 14px;font-size:13.5px;font-weight:700;
  display:flex;align-items:center;gap:8px}
.tr-bhead .owner{font-size:11.5px;font-weight:400;opacity:.9;margin-left:auto}
.tr-tasks{margin:8px 0 0 22px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tr-task{border:1px solid #C9D9EC;border-left:3px solid #2F5597;border-radius:4px;padding:6px 11px;background:#fff}
.tr-task .n{font-size:11px;color:#2F5597;font-weight:700;letter-spacing:.01em}
.tr-task .t{font-size:12.5px;line-height:1.55;color:#22303F;margin-top:2px}
.tr-task .m{font-size:11px;color:#7A828E;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.tr-task .m b{color:#9E2A1E;font-weight:700;font-variant-numeric:tabular-nums}
.tree.k2 .tr-tasks{grid-template-columns:1fr}
.tree.dense .tr-init{padding:7px 15px;font-size:13.5px;margin-bottom:0}
.tree.dense .tr-battle{margin-top:8px;padding-left:14px}
.tree.dense .tr-bhead{padding:5px 12px;font-size:12.5px}
.tree.dense .tr-tasks{margin-top:6px;gap:6px}
.tree.dense .tr-task{padding:4px 9px}
.tree.dense .tr-task .n{font-size:9.5px}
.tree.dense .tr-task .t{font-size:10.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:1;
  -webkit-box-orient:vertical;overflow:hidden}
.tree.dense .tr-task .m{font-size:9.5px;margin-top:1px;gap:8px}
.src-t tbody td{height:62px}

/* cover */
.cover{width:100%;height:100%;background:radial-gradient(circle at 78% 18%,#3A1414 0%,#1B0C0C 55%,#120707 100%);
  display:flex;flex-direction:column;justify-content:center;padding:0 90px;position:relative;overflow:hidden}
.cover::after{content:'';position:absolute;right:-120px;bottom:-160px;width:520px;height:520px;
  border:1px solid rgba(255,255,255,.07);border-radius:50%}
.cover::before{content:'';position:absolute;right:40px;top:-120px;width:280px;height:280px;
  border:1px solid rgba(192,0,0,.25);border-radius:50%}
.cover .k{font-size:12.5px;letter-spacing:.34em;color:#C08A8A;margin-bottom:22px;text-transform:uppercase}
.cover h1{font-size:52px;font-weight:700;color:#fff;letter-spacing:-.01em;line-height:1.2;margin-bottom:16px}
.cover .line{width:66px;height:3px;background:#C00000;margin:0 0 20px}
.cover .sub{font-size:16px;color:#C7B9B9;line-height:1.8;max-width:620px}
.cover .meta{position:absolute;left:90px;bottom:56px;font-size:12px;color:#8A7A7A;display:flex;gap:26px;letter-spacing:.02em}
.cover .yr{position:absolute;right:80px;bottom:38px;font-size:78px;font-weight:700;color:rgba(255,255,255,.06);
  letter-spacing:.04em;line-height:1}

/* slideshow modal */
.player{position:fixed;inset:0;background:#11151B;z-index:200;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transition:opacity .22s}
.player.on{opacity:1;pointer-events:auto}
.pl-top{height:48px;display:flex;align-items:center;gap:14px;padding:0 20px;color:#B8C0CC;font-size:12px;flex-shrink:0}
.pl-top .t{color:#fff;font-size:13px;font-weight:600}
.pl-top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.pl-top button{color:#B8C0CC;padding:4px 9px;border-radius:5px;font-size:12px;transition:.12s}
.pl-top button:hover{background:rgba(255,255,255,.1);color:#fff}
.pl-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 34px;min-height:0;position:relative}
.pl-holder{position:relative}
.pl-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;
  transition:.15s;z-index:5}
.pl-nav:hover{background:rgba(255,255,255,.2)}
.pl-nav.l{left:-52px} .pl-nav.r{right:-52px}
.pl-nav:disabled{opacity:.18;cursor:default}
.pl-bot{height:62px;display:flex;align-items:center;justify-content:center;gap:16px;flex-shrink:0;padding:0 24px}
.dots{display:flex;gap:7px;align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.16s}
.dots i.on{background:#C00000;width:20px;border-radius:4px}
.prog{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.08)}
.prog i{display:block;height:100%;background:#C00000;transition:width .3s}
.pl-num{color:#7C8798;font-size:11.5px;font-variant-numeric:tabular-nums;min-width:52px;text-align:center}

/* generating overlay */
.gen{position:fixed;inset:0;background:rgba(16,20,26,.72);backdrop-filter:blur(6px);z-index:300;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}
.gen.on{opacity:1;pointer-events:auto}
.gen-box{background:#fff;border-radius:14px;padding:30px 34px;width:440px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.gen-box h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.gen-box .sub{font-size:11.5px;color:var(--t3);margin-bottom:18px}
.gen-list{display:flex;flex-direction:column;gap:2px;margin-bottom:20px}
.gen-item{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;font-size:12.5px;
  color:var(--t4);transition:.2s}
.gen-item .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--t4);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:9px;transition:.2s}
.gen-item.run{background:var(--p-l2);color:var(--p)}
.gen-item.run .dot{border-color:var(--p);animation:pulse 1s infinite}
.gen-item.done{color:var(--t2)}
.gen-item.done .dot{border-color:var(--green);background:var(--green);color:#fff;animation:none}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.18);opacity:.6}}
.gen-bar{height:3px;background:var(--bd2);border-radius:2px;overflow:hidden}
.gen-bar i{display:block;height:100%;background:linear-gradient(90deg,#C00000,#E05050);width:0;transition:width .35s}

/* toast */
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,14px);background:#1F2329;color:#fff;
  font-size:12.5px;padding:9px 18px;border-radius:20px;z-index:400;opacity:0;pointer-events:none;transition:.22s;
  box-shadow:0 6px 24px rgba(0,0,0,.22)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* misc */
.kv{display:flex;gap:6px;font-size:11.5px;color:var(--t3);align-items:center}
.kv b{color:var(--t1);font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--t4);font-size:12.5px}
.empty .ic{width:26px;height:26px;margin:0 auto 10px;stroke-width:1.2;opacity:.5}
.split2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;color:var(--t3);margin-bottom:5px;font-weight:600}
.hide{display:none!important}
.row{display:flex;align-items:center;gap:10px}
.sel{appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4l3 3 3-3' fill='none' stroke='%2386909C' stroke-width='1.4' stroke-linecap='round'/></svg>") no-repeat right 9px center;
  border:1px solid var(--bd);border-radius:6px;padding:6px 26px 6px 10px;font-size:12.5px;cursor:pointer}
.sel:focus{border-color:var(--p)}
/* ============ SLIDE 容器 ============ */
.slide-box{position:relative;overflow:hidden;width:100%;aspect-ratio:16/9;background:#fff;border-radius:6px}
.slide-inner{position:absolute;top:0;left:0;width:1280px;height:720px;transform-origin:top left}
.slide-inner>.slide{position:absolute;top:0;left:0}

/* 各页行高 */
.p1t thead th{height:52px;font-size:15px}
.p1t thead tr:nth-child(2) th{height:40px;font-size:13.5px}
.p1t tbody td{height:106px;font-size:18px}
.p1t td.rowlab{font-size:17px}
.p2t thead th{height:48px}
.p2t tbody td{height:58px;font-size:14.5px}
.p2t td.rowlab{font-size:14.5px}
.p3t thead th{height:56px}
.p3t tbody td{height:86px}
.p5t thead th{height:46px;font-size:13px}
.p5t thead tr:nth-child(2) th{height:38px;font-size:12.5px}
.p5t tbody td{height:68px;font-size:13px}
.p6t thead th{height:48px}
.p6t tbody td{height:96px;font-size:16px}

/* ============ 缩略图 ============ */
.thumb-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.thumb{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px;cursor:pointer;transition:.15s}
.thumb:hover{border-color:var(--p);box-shadow:var(--shadow);transform:translateY(-2px)}
.thumb .slide-box{border:1px solid var(--bd2);border-radius:4px}
.th-meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--t3);padding:9px 4px 0}
.th-meta span:last-child{font-variant-numeric:tabular-nums;color:var(--t4)}

/* ============ P4 树形编辑器 ============ */
.te-wrap{display:flex;flex-direction:column;gap:12px}
.te-card{border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:#fff}
.te-head{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#FBF4F3;border-bottom:1px solid #F0DFDC}
.te-head>.num{width:21px;height:21px;border-radius:4px;background:#9E2A1E;color:#fff;font-size:11px;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.te-head .lb{font-size:11px;color:var(--t3);flex-shrink:0}
.te-head input{flex:1;border:1px solid transparent;background:#fff;border-radius:5px;padding:5px 9px;font-size:12.5px}
.te-head input[data-k="goal"]{flex:0 0 170px}
.te-head input:hover{border-color:#E3CFCB}
.te-head input:focus{border-color:#9E2A1E;box-shadow:0 0 0 3px rgba(158,42,30,.08)}
.te-battles{padding:10px 12px;display:flex;flex-direction:column;gap:9px}
.te-battle{border:1px solid #F0DFDC;border-radius:7px;overflow:hidden}
.te-bhead{display:flex;align-items:center;gap:7px;padding:6px 10px;background:#B43A2C}
.te-bhead>.num{font-size:11px;color:rgba(255,255,255,.85);font-weight:700;flex-shrink:0;min-width:26px}
.te-bhead .lb{font-size:11px;color:rgba(255,255,255,.7);flex-shrink:0}
.te-bhead input{flex:1;border:1px solid transparent;border-radius:5px;padding:4px 8px;font-size:12.5px;
  background:rgba(255,255,255,.13);color:#fff}
.te-bhead input[data-k="goal"]{flex:0 0 110px}
.te-bhead input::placeholder{color:rgba(255,255,255,.45)}
.te-bhead input:focus{background:rgba(255,255,255,.24);border-color:rgba(255,255,255,.4)}
.te-bhead select{border:none;border-radius:5px;padding:4px 6px;font-size:12px;
  background:rgba(255,255,255,.16);color:#fff;cursor:pointer}
.te-bhead .btn{background:rgba(255,255,255,.18);border:none;color:#fff}
.te-bhead .btn:hover{background:rgba(255,255,255,.3);color:#fff;border:none}
.te-bhead .rowdel{color:rgba(255,255,255,.65)}
.te-bhead .rowdel:hover{color:#fff}
.te-tasks{padding:8px 10px;display:grid;grid-template-columns:1fr;gap:6px;background:#fff}
.te-task{display:grid;grid-template-columns:44px 1fr 1.6fr 80px 84px 22px;gap:6px;align-items:center;
  border:1px solid var(--bd2);border-left:2px solid var(--p);border-radius:5px;padding:5px 8px;background:#FCFDFE}
.te-task .num{font-size:10.5px;color:var(--p);font-weight:700}
.te-task input{border:1px solid transparent;border-radius:4px;padding:3px 6px;font-size:12px;background:transparent;min-width:0}
.te-task input:hover{border-color:var(--bd)}
.te-task input:focus{border-color:var(--p);background:#fff}
.te-task input[data-k="amount"]{text-align:right}
.te-task select{border:1px solid transparent;border-radius:4px;padding:3px 4px;font-size:11.5px;background:transparent;cursor:pointer}
.te-task select:hover{border-color:var(--bd)}


/* ============ 当前主体卡 ============ */
.side-org{background:linear-gradient(140deg,#F8FBFF,#ECF3FB);border:1px solid #DCE8F5;border-radius:9px;
  padding:11px 12px;margin:0 0 8px}
.so-k{font-size:9.5px;color:#8FA6BF;letter-spacing:.08em;margin-bottom:3px}
.so-n{font-size:15px;font-weight:700;color:var(--t1);line-height:1.35;letter-spacing:-.01em}
.so-p{font-size:10.5px;color:#7C8EA3;margin-top:2px;line-height:1.45}
.so-row{display:flex;align-items:center;gap:6px;margin-top:7px}
.so-pct{margin-left:auto;font-size:11px;font-weight:700;color:var(--p);font-variant-numeric:tabular-nums}
.so-sel{width:100%;margin-top:8px;font-size:11.5px;padding:4px 24px 4px 8px;background:#fff;border-color:#D5E3F2}
.so-own{font-size:10.5px;color:#95A6B8;margin-top:6px}

/* ============ 提交卡 ============ */
.sub-card{display:flex;align-items:center;gap:14px;border-radius:10px;padding:14px 18px;margin-bottom:16px;border:1px solid}
.sub-card .sc-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;flex-shrink:0;font-weight:700}
.sub-card .sc-body{flex:1;min-width:0}
.sub-card h4{font-size:13.5px;font-weight:700;margin-bottom:2px}
.sub-card p{font-size:11.5px;color:var(--t3);line-height:1.6}
.sub-card.ok{background:#F4FBF7;border-color:#CDE9DA}
.sub-card.ok .sc-ico{background:var(--green-l);color:var(--green)}
.sub-card.ready{background:#F5F9FE;border-color:#D3E2F5}
.sub-card.ready .sc-ico{background:var(--p-l);color:var(--p)}
.sub-card.todo{background:#FFFBF2;border-color:#F2E3C4}
.sub-card.todo .sc-ico{background:var(--amber-l);color:var(--amber)}

/* ============ 只读提示条 ============ */
.lock-bar{display:flex;gap:10px;align-items:flex-start;background:#F4FBF7;border:1px solid #CDE9DA;
  border-radius:8px;padding:10px 14px;margin-bottom:14px;color:#14603F}
.lock-bar .ic{margin-top:2px;color:var(--green);flex-shrink:0}
.lock-bar b{display:block;font-size:12.5px;margin-bottom:1px}
.lock-bar span{font-size:11.5px;color:#3D7A5F;line-height:1.6}

/* ============ 组织树 ============ */
.org-head,.org-row{display:grid;grid-template-columns:minmax(150px,1fr) 78px 92px 96px 40px 84px 100px;
  gap:8px;align-items:center}
.org-head{padding:0 10px 7px;font-size:10.5px;color:var(--t4);border-bottom:1px solid var(--bd)}
.org-row{padding:6px 10px;border-bottom:1px solid var(--bd2);transition:.12s}
.org-row:hover{background:#FBFCFE}
.org-row:last-child{border-bottom:none}
.org-cell{display:flex;align-items:center;gap:5px;min-width:0}
.org-ind{color:#C3CAD3;font-size:11px;flex-shrink:0;font-family:monospace}
.org-name{border:1px solid transparent;border-radius:5px;padding:5px 8px;font-size:12.5px;font-weight:600;
  background:transparent;width:100%;min-width:0;transition:.12s}
.org-name:hover{border-color:var(--bd);background:#fff}
.org-name:focus{border-color:var(--p);background:#fff;box-shadow:0 0 0 3px rgba(24,95,165,.08)}
.org-sel{font-size:11.5px;padding:4px 22px 4px 7px;width:100%;border-color:transparent;background-color:transparent}
.org-sel:hover{border-color:var(--bd);background-color:#fff}
.org-prog{height:5px;background:var(--bd2);border-radius:3px;overflow:hidden}
.org-prog i{display:block;height:100%;background:var(--green);border-radius:3px}
.org-pct{font-size:11px;color:var(--t3);text-align:right;font-variant-numeric:tabular-nums}
.org-tag{text-align:center}
.org-acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}

/* ============ 评审汇总 ============ */
.rv-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.rv-tbl th{text-align:left;font-size:11px;color:var(--t3);font-weight:600;padding:8px 10px;
  border-bottom:1px solid var(--bd);background:#FCFCFD}
.rv-tbl td{padding:10px;border-bottom:1px solid var(--bd2);vertical-align:middle}
.rv-tbl tr:last-child td{border-bottom:none}
.rv-tbl tbody tr:hover td{background:#FCFDFF}
.ck{display:flex;align-items:center;gap:8px;cursor:pointer}
.ck input{width:14px;height:14px;accent-color:var(--p);cursor:pointer}
.ck span{font-weight:600}
.org-sub{font-size:10.5px;color:var(--t4);margin-top:3px;padding-left:22px}

/* ============ 汇总来源页统计条 ============ */
.sum-stat{display:flex;gap:28px;align-items:center;margin-bottom:20px;padding:13px 20px;
  background:#F6FAFE;border:1px solid #E1ECF8;border-radius:8px;flex-wrap:wrap}
.sum-stat span{font-size:12px;color:var(--t3);display:flex;align-items:baseline;gap:5px}
.sum-stat b{font-size:19px;color:var(--p);font-weight:700;letter-spacing:-.02em}

/* ============ 汇总操作区 ============ */
.sum-box{display:flex;gap:24px;align-items:center;background:linear-gradient(135deg,#1B1F26 0%,#2C1A1A 100%);
  color:#fff;border-radius:12px;padding:22px 26px;margin-top:4px}
.sum-l{flex:1;min-width:0}
.sum-l h3{font-size:15px;font-weight:700;margin-bottom:6px}
.sum-l p{font-size:12px;color:#B9C0CB;line-height:1.75}
.sum-rules{display:flex;gap:16px;flex-wrap:wrap;margin-top:11px;font-size:11px;color:#8E97A5}
.sum-rules span{display:flex;align-items:center;gap:5px}
.sum-rules i{width:4px;height:4px;border-radius:50%;background:#C00000;flex-shrink:0}
.sum-r{text-align:center;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:12px}
.sum-preview b{font-size:36px;font-weight:700;line-height:1;color:#fff;letter-spacing:-.02em}
.sum-preview span{font-size:13px;color:#8E97A5;margin-left:2px}
.sum-preview small{display:block;font-size:10.5px;color:#7A828E;margin-top:5px;letter-spacing:.02em}
.sum-r .btn{background:linear-gradient(135deg,#C00000,#961818);border:none;color:#fff;padding:9px 20px;font-size:12.5px}
.sum-r .btn:hover{filter:brightness(1.1)}

/* ============ 幻灯片：汇总标识 ============ */
.sd-tag{display:inline-block;font-size:11px;font-weight:600;color:#9E2A1E;background:#FBEDEB;
  border:1px solid #F0D5D0;border-radius:4px;padding:1px 6px;margin-left:9px;vertical-align:4px;letter-spacing:.02em}
.src-tag{display:block;font-size:10.5px;font-weight:400;color:#8A93A0;margin-top:3px;letter-spacing:.01em}
.tr-init .tr-org{font-size:11px;font-weight:400;background:rgba(255,255,255,.2);padding:1px 8px;
  border-radius:10px;margin-left:8px;letter-spacing:.02em}


/* ============ 用户切换 ============ */
.user-btn{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid transparent;
  border-radius:22px;padding:4px 9px 4px 4px;transition:.15s;max-width:250px}
.user-btn:hover{background:#fff;border-color:var(--bd);box-shadow:0 1px 5px rgba(0,0,0,.07)}
.user-btn .uav{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#DCEBFB,#C7DFF7);
  color:#17527F;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;flex-shrink:0}
.uinfo{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;min-width:0}
.uinfo b{font-size:12.5px;font-weight:600;color:var(--t1);white-space:nowrap}
.uinfo small{font-size:10px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:148px}
.user-btn>.ic{width:12px;height:12px;color:var(--t4);flex-shrink:0;stroke-width:2}
.user-pop{position:fixed;right:18px;top:62px;width:272px;background:#fff;border:1px solid var(--bd);
  border-radius:11px;box-shadow:0 12px 40px rgba(0,0,0,.16);padding:7px;z-index:90;
  opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.16s;transform-origin:top right}
.user-pop.on{opacity:1;transform:none;pointer-events:auto}
.up-head{display:flex;align-items:center;gap:6px;padding:6px 10px 9px;font-size:11px;color:var(--t3);
  border-bottom:1px solid var(--bd2);margin-bottom:4px}
.up-head b{color:var(--t1);font-size:11.5px;font-weight:700}
.up-grp{font-size:9.5px;color:var(--t4);padding:8px 10px 4px;letter-spacing:.07em;font-weight:600}
.up-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:7px;
  font-size:12.5px;color:var(--t2);transition:.12s;text-align:left}
.up-item:hover{background:var(--bg)}
.up-item.on{background:var(--p-l)}
.up-item .uav{width:25px;height:25px;font-size:10.5px;background:#EDF1F6;color:var(--t2);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.up-item.on .uav{background:var(--p);color:#fff}
.up-item .ui2{flex:1;min-width:0;line-height:1.3}
.up-item .ui2 b{display:block;font-size:12.5px;font-weight:600;color:var(--t1)}
.up-item.on .ui2 b{color:var(--p)}
.up-item .ui2 small{font-size:10px;color:var(--t4);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-item .chk{color:var(--p);font-size:12px;font-weight:700}
.up-foot{padding:9px 10px 4px;margin-top:4px;border-top:1px solid var(--bd2);font-size:10px;color:var(--t4);line-height:1.6}


/* ============ 弹窗 ============ */
.modal{position:fixed;inset:0;background:rgba(16,20,26,.5);backdrop-filter:blur(3px);z-index:320;
  display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.18s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{background:#fff;border-radius:12px;width:580px;max-width:92vw;max-height:84vh;overflow:auto;
  padding:22px 24px;box-shadow:0 22px 64px rgba(0,0,0,.28);transform:translateY(8px);transition:.2s}
.modal.on .mbox{transform:none}
.mbox h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.mbox .sub{font-size:11.5px;color:var(--t3);margin-bottom:16px;line-height:1.6}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--bd2)}


/* ============ 侧栏可折叠分组 ============ */
.side .grp-t{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;transition:.12s}
.side .grp-t:hover{color:var(--t2)}
.side .grp-t .t{flex:1;min-width:0}

function pageProgress(id, orgId) {
  const src = orgId ? (curYearData()[orgId] || emptyData()) : D();
  if (DOC_PAGES.indexOf(id) >= 0) return docProgress(src[id]);
  const t = findTpl(id);
  const req = (t.fields || []).filter(f => f.req && f.on !== false).map(f => f.k);
  let total = 0, filled = 0;
  const hit = v => { total++; if (v !== '' && v !== null && v !== undefined) filled++; };

  if (id === 'p1') {
    DB.dict.indicators.forEach(ind => p1Years().forEach(y => {
      const c = (src.p1.cells[ind.name + '|' + y.y]) || {};
      if (req.includes('target')) hit(c.target);
      if (req.includes('actual')) hit(c.actual);
    }));
  } else if (id === 'p2') {
    DB.dict.dims.forEach(g => g.items.forEach(it => {
      const r = (src.p2.rows[g.name + '|' + it]) || {};
      if (req.includes('qty')) hit(r.qty);
      if (req.includes('cur')) hit(r.cur);
      if (req.includes('next')) hit(r.next);
    }));
  } else if (id === 'p3') {
    src.p3.rows.forEach(r => ['dir', 'desc', 'name', 'def'].forEach(k => { if (req.includes(k)) hit(r[k]); }));
  } else if (id === 'p4') {
    src.p4.initiatives.forEach(i => {
      if (req.includes('initiative')) hit(i.name);
      i.battles.forEach(b => {
        if (req.includes('battle')) hit(b.name);
        b.tasks.forEach(t => { if (req.includes('task')) hit(t.name); });
      });
    });
  } else if (id === 'p5') {
    src.p5.rows.forEach(r => {
      ['init', 'battle', 'task', 'iname', 'idef', 'v24', 'v25', 'dept'].forEach(k => { if (req.includes(k)) hit(r[k]); });
    });
    } else if (id === 'r3') {
    src.r3.rows.forEach(r => ['code', 'desc', 'battle', 'task', 'status'].forEach(k => { if (req.includes(k)) hit(r[k]); }));
  } else if (id === 'r7') {
    src.r7.rows.forEach(r => ['item', 'cause', 'strategy'].forEach(k => { if (req.includes(k)) hit(r[k]); }));
  } else if (id === 'r4') {
    src.r4.rows.forEach(r => ['gap', 'cause', 'action', 'dept', 'due'].forEach(k => { if (req.includes(k)) hit(r[k]); }));
  } else if (id === 'p6') {
    DB.dict.dirs.forEach(d => DB.dict.indicators.forEach(ind => {
      const r = (src.p6.rows[d + '|' + ind.name]) || {};
      const keys = ['t27', 'r27', 't26', 'a26', 'a25', 'a24'];
      if (!keys.some(k => r[k])) return;
      keys.forEach(k => { if (req.includes(k)) hit(r[k]); });
    }));
  }
  if (!total) return 0;
  return Math.round(filled / total * 100);
}

      if (!/^\d+(\.\d+)*$/.test(String(r.code).trim())) return;
      const idx = parseInt(r.code, 10) - 1;
      const it = (d.p4 && d.p4.initiatives || [])[idx];
      if (it && it.name) r.code = it.name;
    });
  }));
}
function yoyText(cur, prev) {
  const a = num(cur), b = num(prev);
  if (a === null || b === null || b === 0) return '';
  const v = (a - b) / Math.abs(b) * 100;
  return (v > 0 ? '+' : '') + v.toFixed(1) + '%';
}

function overallProgress(orgId) {
  return Math.round(ALL_PAGES.map(id => pageProgress(id, orgId)).reduce((a, b) => a + b, 0) / ALL_PAGES.length);
}

/* ---------------- P2 ---------------- */
function p2Sub(g) {
  const s = { qty: 0, cur: 0, next: 0, has: false };
  g.items.forEach(it => {
    const r = D().p2.rows[g.name + '|' + it] || {};
    ['qty', 'cur', 'next'].forEach(k => {
      const n = num(r[k]);
      if (n !== null) { s[k] += n; s.has = true; }
    });
  });
  return s;
}
function edP2() {
  let rows = '';
  DB.dict.dims.forEach(g => {
    const span = g.items.length + 1;
    g.items.forEach((it, i) => {
      const key = g.name + '|' + it;
      const r = D().p2.rows[key] || (D().p2.rows[key] = { qty: '', cur: '', next: '' });
      const grow = (num(r.next) !== null && num(r.cur) !== null) ? (num(r.next) - num(r.cur)) : null;
      const rate = (grow !== null && num(r.cur)) ? (grow / num(r.cur) * 100).toFixed(1) + '%' : '';
      rows += '<tr>';
      if (i === 0) rows += `<td class="lbl" rowspan="${span}">${esc(g.name)}</td>`;
      rows += `<td class="lbl sub">${esc(it)}</td>`;
      rows += `<td class="cell-num"><input data-p="p2" data-g="${esc(g.name)}" data-i="${esc(it)}" data-k="qty" value="${esc(r.qty)}" inputmode="numeric" placeholder="—"></td>`;
      rows += `<td class="cell-num"><input data-p="p2" data-g="${esc(g.name)}" data-i="${esc(it)}" data-k="cur" value="${esc(r.cur)}" inputmode="decimal" placeholder="—"></td>`;
      rows += `<td class="cell-num"><input data-p="p2" data-g="${esc(g.name)}" data-i="${esc(it)}" data-k="next" value="${esc(r.next)}" inputmode="decimal" placeholder="—"></td>`;
      rows += `<td class="cell-num" style="background:#FAFCFE"><span class="auto ${grow === null ? 'blank' : ''}" data-calc="p2|${esc(g.name)}|${esc(it)}|g">${grow === null ? '—' : fmt(grow)}</span></td>`;
      rows += `<td class="cell-num" style="background:#FAFCFE"><span class="auto ${rate ? '' : 'blank'}" data-calc="p2|${esc(g.name)}|${esc(it)}|r">${rate || '—'}</span></td>`;
      rows += '</tr>';
    });
    const s = p2Sub(g);
    rows += `<tr class="grp-row"><td class="lbl sub" style="color:var(--p)">${esc(g.sub || '小计')}</td>
      <td class="cell-num"><span class="auto" data-calc="p2sub|${esc(g.name)}|qty">${s.qty ? fmt(s.qty) : '—'}</span></td>
      <td class="cell-num"><span class="auto" data-calc="p2sub|${esc(g.name)}|cur">${s.cur ? fmt(s.cur) : '—'}</span></td>
      <td class="cell-num"><span class="auto" data-calc="p2sub|${esc(g.name)}|next">${s.next ? fmt(s.next) : '—'}</span></td>
      <td class="cell-num"><span class="auto" data-calc="p2sub|${esc(g.name)}|g">${(s.next && s.cur) ? fmt(s.next - s.cur) : '—'}</span></td>
      <td class="cell-num"><span class="auto" data-calc="p2sub|${esc(g.name)}|r">${(s.next && s.cur) ? ((s.next - s.cur) / s.cur * 100).toFixed(1) + '%' : '—'}</span></td></tr>`;
  });
  return `<div class="edit-wrap">
    <div class="edit-bar">
      <span class="kv">行：<b>维度字典</b>（${DB.dict.dims.map(g => g.name).join(' / ')}）</span>

    </div>
    <div class="tbl-scroll"><table class="et">
      <thead><tr>
        <th style="width:110px" rowspan="2">${esc(fLabel('p2', 'group', '维度'))}</th>
        <th style="width:120px" rowspan="2">${esc(fLabel('p2', 'item', '细分项'))}</th>

      </tr><tr>
        <th style="text-align:right">${esc(fLabel('p2', 'cur', '本年预计'))}</th>
        <th style="text-align:right">${esc(fLabel('p2', 'next', '下年目标'))}</th>
        <th style="text-align:right">${esc(fLabel('p2', 'growth', '增长额'))}</th>
        <th style="text-align:right">${esc(fLabel('p2', 'rate', '增长率'))}</th>

      <tbody>${rows}</tbody></table></div>
    <div style="padding:10px 14px;font-size:11.5px;color:var(--t3);border-top:1px solid var(--bd2)">
      小计行由系统自动汇总，不可编辑。增长额 = 下年目标 − 本年预计；增长率 = 增长额 ÷ 本年预计。

  rows.forEach(o => {

    const prog = overallProgress(o.id);
    const isLeaf = orgChildren(o.id).length === 0;
    const tag = st.status === 'submitted' ? '<span class="pill green">已提交</span>'
      : (prog >= 100 ? '<span class="pill blue">待提交</span>'
        : (prog > 0 ? '<span class="pill amber">填报中</span>' : '<span class="pill gray">未开始</span>'));
    list += `<div class="org-row">
      <div class="org-cell" style="padding-left:${o.depth * 26}px">${o.depth ? '<span class="org-ind">└</span>' : ''}
        <input class="org-name" data-org="${o.id}" data-f="name" value="${esc(o.name)}"></div>
      <select class="sel org-sel" data-org="${o.id}" data-f="type">
        ${['集团', '中心', '部门', '组'].map(t => `<option ${o.type === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
      <select class="sel org-sel" data-org="${o.id}" data-f="owner">

      </select>

/* ---------------- 评审汇总 ---------------- */
function viewReview() {
  const leaves = orgLeaves();
  const subs = leaves.filter(o => subOf(o.id).status === 'submitted');
  const pending = leaves.filter(o => subOf(o.id).status !== 'submitted');
  const avgAll = leaves.length ? Math.round(leaves.reduce((a, o) => a + overallProgress(o.id), 0) / leaves.length) : 0;
  if (!state.reviewSel) state.reviewSel = subs.map(o => o.id);

  // 汇总后可以得到的数字（用于预览提示）
  let rows = '';
  leaves.forEach(o => {
    const st = subOf(o.id);
    const prog = overallProgress(o.id);
    const isSub = st.status === 'submitted';
    const back = st.status === 'returned';
    rows += `<tr>
      <td>
        <label class="ck"><input type="checkbox" data-selorg="${o.id}" ${state.reviewSel.includes(o.id) ? 'checked' : ''}>
        <span>${esc(o.name)}</span></label>
        <div class="org-sub">${esc(orgPath(o.id))}</div>
      </td>
      <td>${esc(o.owner || '—')}</td>
      <td style="text-align:right">${prog}%</td>
      <td>${isSub ? '<span class="pill green">已提交</span>' : (back ? '<span class="pill red">已退回</span>' : (prog > 0 ? '<span class="pill amber">填报中</span>' : '<span class="pill gray">未开始</span>'))}</td>
      <td style="color:var(--t3);font-size:11.5px">${isSub ? esc(st.at || '') : '—'}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="btn sm" data-preview="${o.id}">预览 PPT</button>
        ${isSub ? `<button class="btn sm danger" data-return="${o.id}">退回</button>`
      : `<button class="btn sm" data-goto="${o.id}">代填</button>`}
      </td>
    </tr>`;
  });
  if (!rows) rows = '<tr><td colspan="6"><div class="empty">还没有填报主体，先去组织架构里添加部门</div></td></tr>';

  const selCount = state.reviewSel.length;
  const selNames = state.reviewSel.map(id => (orgById(id) || {}).name).filter(Boolean);

/* ---------------- 合并算法 ---------------- */
const _sum = a => a.length ? a.reduce((x, y) => x + y, 0) : null;
const _avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const _r = v => (v === null || v === undefined) ? '' : String(Math.round(v * 100) / 100);

function mergeData(ids) {
  const out = emptyData();
  const acc = { p1: {}, p2: {}, p6: {} };

  ids.forEach(id => {
    const d = curYearData()[id];
    if (!d) return;
    // ---- P1 数值 ----
    Object.keys(d.p1.cells || {}).forEach(key => {
      const c = d.p1.cells[key] || {};
      const a = acc.p1[key] || (acc.p1[key] = { target: [], actual: [] });
      if (num(c.target) !== null) a.target.push(num(c.target));
      if (num(c.actual) !== null) a.actual.push(num(c.actual));
    });
    // ---- P2 数值 ----
    Object.keys(d.p2.rows || {}).forEach(key => {
      const r = d.p2.rows[key] || {};
      const a = acc.p2[key] || (acc.p2[key] = { qty: [], cur: [], next: [] });
      ['qty', 'cur', 'next'].forEach(k => { if (num(r[k]) !== null) a[k].push(num(r[k])); });
    });
    // ---- P6 数值 ----
    Object.keys(d.p6.rows || {}).forEach(key => {
      const r = d.p6.rows[key] || {};
      const a = acc.p6[key] || (acc.p6[key] = { t27: [], t26: [], a26: [], a25: [], a24: [] });
      ['t27', 't26', 'a26', 'a25', 'a24'].forEach(k => { if (num(r[k]) !== null) a[k].push(num(r[k])); });
    });
  });

  Object.keys(acc.p1).forEach(key => {
    const ind = key.split('|')[0];
    const agg = indAgg(ind);
    const a = acc.p1[key];
    const t = agg === 'avg' ? _avg(a.target) : _sum(a.target);
    const ac = agg === 'avg' ? _avg(a.actual) : _sum(a.actual);
    out.p1.cells[key] = { target: _r(t), actual: _r(ac) };
  });
  Object.keys(acc.p2).forEach(key => {
    const a = acc.p2[key];
    out.p2.rows[key] = { qty: _r(_sum(a.qty)), cur: _r(_sum(a.cur)), next: _r(_sum(a.next)) };
  });
  Object.keys(acc.p6).forEach(key => {
    const ind = key.split('|')[1];
    const agg = indAgg(ind);
    const a = acc.p6[key];
    const f = arr => agg === 'avg' ? _avg(arr) : _sum(arr);
    out.p6.rows[key] = {
      t27: _r(f(a.t27)), t26: _r(f(a.t26)), a26: _r(f(a.a26)),
      a25: _r(f(a.a25)), a24: _r(f(a.a24)), r27: ''
    };
    // 增长率按汇总后重算：本年目标 ÷ 上年实际 − 1
    const t = f(a.t27), p = f(a.a25);
    if (t !== null && p) out.p6.rows[key].r27 = ((t - p) / p * 100).toFixed(0) + '%';
  });

  // ---- 回顾：文档合并 + 执行记录合并 ----
  ids.forEach(id => {
    const d = curYearData()[id];
    if (!d) return;
    const on = (orgById(id) || {}).name || id;
    DOC_PAGES.forEach(k => {
      (d[k] && d[k].docs || []).forEach(doc => {
        out[k].docs.push(Object.assign({}, doc, { _org: on }));
      });
    });
    (d.r3.rows || []).forEach(r => {
      if (!r.task && !r.code) return;
      out.r3.rows.push(Object.assign({}, r, { _org: on }));
    });
  });

  // ---- P3 条目合并 ----
  ids.forEach(id => {
    const d = curYearData()[id];
    if (!d) return;
    const on = (orgById(id) || {}).name || id;
    (d.p3.rows || []).forEach(r => {
      if (!r.name && !r.dir) return;
      out.p3.rows.push(Object.assign({}, r, { _org: on }));
    });
  });

  // ---- P4 树合并 + 编号重排 ----
  let ii = 0;
  ids.forEach(id => {
    const d = curYearData()[id];
    if (!d) return;
    const on = (orgById(id) || {}).name || id;
    (d.p4.initiatives || []).forEach(it => {
      if (!it.name) return;
      ii++;
      const ni = { code: String(ii), name: it.name, goal: it.goal, _org: on, battles: [] };
      let bc = 0;
      it.battles.forEach(b => {
        if (!b.name) return;
        bc++;
        const nb = { code: ii + '.' + bc, name: b.name, goal: b.goal, owner: b.owner, tasks: [] };
        let tc = 0;
        b.tasks.forEach(t => {
          if (!t.name) return;
          tc++;
          nb.tasks.push({ code: ii + '.' + bc + '.' + tc, name: t.name, basis: t.basis, amount: t.amount, period: t.period });
        });
        ni.battles.push(nb);
      });
      out.p4.initiatives.push(ni);
    });
  });

  // ---- P5 条目合并（把层级索引解析成名称） ----
  ids.forEach(id => {
    const d = curYearData()[id];
    if (!d) return;
    const on = (orgById(id) || {}).name || id;
    (d.p5.rows || []).forEach(r => {
      if (!r.iname && !r.task) return;
      const it = d.p4.initiatives[parseInt(r.init, 10) - 1];
      const b = it ? it.battles[parseInt(r.battle, 10) - 1] : null;
      const t = b ? b.tasks[parseInt(r.task, 10) - 1] : null;
      out.p5.rows.push(Object.assign({}, r, {
        _initName: it ? it.name : '', _battleName: b ? b.name : '',
        _taskName: t ? t.name : '', _org: on
      }));
    });
  });

  return out;
}

/* ---------------- xlsx 写入（stored zip） ---------------- */
function xmlEsc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function crc32(u8) {
  let crc = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) {
    let c = (crc ^ u8[i]) & 0xFF;
    for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
    crc = (crc >>> 8) ^ c;
  }
  return (crc ^ 0xFFFFFFFF) >>> 0;
}
function zipBytes(files) {
  const enc = new TextEncoder();

  let offset = 0;
  files.forEach(f => {
    const nameBytes = enc.encode(f.name);
    const data = f.data instanceof Uint8Array ? f.data : enc.encode(f.data);
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nameBytes.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, 0, true); dv.setUint16(12, 0x2821, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nameBytes.length, true); dv.setUint16(28, 0, true);
    lh.set(nameBytes, 30);
    chunks.push(lh, data);

    const ch = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(ch.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, 0, true);
    cv.setUint16(14, 0x2821, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true); cv.setUint16(28, nameBytes.length, true);
    cv.setUint32(42, offset, true);
    ch.set(nameBytes, 46);
    central.push(ch);
    offset += lh.length + data.length;
  });
  const cdSize = central.reduce((a, b) => a + b.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, files.length, true);
  ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true);
  ev.setUint32(16, offset, true);
  const all = chunks.concat(central, [eocd]);
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let p = 0;
  all.forEach(c => { out.set(c, p); p += c.length; });
  return out;
}

  return new Blob([zipBytes(files)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function colRef(ci) {
  let n = ci + 1, s = '';
  while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); }
  return s;
}
function sheetXml(rows) {
  const maxCol = rows.reduce((m, r) => Math.max(m, r.length), 1);
  let cols = '<cols><col min="1" max="1" width="24" customWidth="1"/><col min="2" max="' + Math.max(2, maxCol)
    + '" width="17" customWidth="1"/></cols>';

    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + '<sheetViews><sheetView workbookViewId="0" tabSelected="1"/></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="18"/>' + cols + '<sheetData>';
  rows.forEach((row, ri) => {
    x += '<row r="' + (ri + 1) + '"' + (ri === 0 ? ' ht="26" customHeight="1"' : '') + '>';
    row.forEach((v, ci) => {
      const val = (v === null || v === undefined) ? '' : String(v);
      if (val === '') return;
      const st = ri === 0 ? ' s="1"' : '';
      const ref = colRef(ci) + (ri + 1);

}
function downloadBlob(name, blob) {

/* ---------------- xlsx 读取 ---------------- */
async function inflateRaw(u8) {
  if (typeof DecompressionStream === 'undefined') {
    throw new Error('当前浏览器不支持解压 xlsx，请改用 CSV');
  }
  const ds = new DecompressionStream('deflate-raw');
  const stream = new Blob([u8]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function unzip(u8) {
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  let eocd = -1;
  const min = Math.max(0, u8.length - 65558);
  for (let i = u8.length - 22; i >= min; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('不是有效的 xlsx 文件');
  const count = dv.getUint16(eocd + 10, true);
  let off = dv.getUint32(eocd + 16, true);
  const out = {};
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nameLen));
    const lNameLen = dv.getUint16(lho + 26, true);
    const lExtraLen = dv.getUint16(lho + 28, true);
    const ds = lho + 30 + lNameLen + lExtraLen;
    let data = u8.subarray(ds, ds + csize);
    if (method === 8) data = await inflateRaw(data);
    else if (method !== 0) { off += 46 + nameLen + extraLen + cmtLen; continue; }
    out[name] = data;
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return out;
}
function sheetToGrid(xmlText, files) {
  const dec = new TextDecoder();
  const shared = [];
  if (files['xl/sharedStrings.xml']) {
    try {
      const sdoc = new DOMParser().parseFromString(dec.decode(files['xl/sharedStrings.xml']), 'text/xml');
      Array.from(sdoc.querySelectorAll('si')).forEach(si => {
        let t = '';
        Array.from(si.querySelectorAll('t')).forEach(x => { t += x.textContent; });
        shared.push(t);
      });
    } catch (e) {}
  }
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  const grid = [];
  Array.from(doc.querySelectorAll('row')).forEach(row => {
    const r = parseInt(row.getAttribute('r') || '0', 10) - 1;
    if (r < 0) return;
    const arr = grid[r] || (grid[r] = []);
    Array.from(row.querySelectorAll('c')).forEach(c => {
      const ref = c.getAttribute('r') || '';
      const m = ref.match(/^([A-Z]+)/);
      if (!m) return;
      let ci = 0;
      for (let i = 0; i < m[1].length; i++) ci = ci * 26 + (m[1].charCodeAt(i) - 64);
      ci--;
      const ty = c.getAttribute('t');
      let v = '';
      if (ty === 's') {
        const vn = c.querySelector('v');
        const idx = vn ? parseInt(vn.textContent, 10) : -1;
        v = shared[idx] !== undefined ? shared[idx] : '';
      } else if (ty === 'inlineStr') {
        v = Array.from(c.querySelectorAll('t')).map(x => x.textContent).join('');
      } else {
        const vn = c.querySelector('v');
        v = vn ? vn.textContent : '';
      }
      arr[ci] = v;
    });
  });
  for (let i = 0; i < grid.length; i++) if (!grid[i]) grid[i] = [];
  return grid;
}
async function readXlsx(buf) {
  const files = await unzip(buf instanceof Uint8Array ? buf : new Uint8Array(buf));
  const dec = new TextDecoder();
  if (files['xl/worksheets/sheet1.xml']) {
    return sheetToGrid(dec.decode(files['xl/worksheets/sheet1.xml']), files);
  }
  const key = Object.keys(files).find(k => /^xl\/worksheets\/.+\.xml$/.test(k));
  if (!key) throw new Error('文件里没有工作表');
  return sheetToGrid(dec.decode(files[key]), files);
}
function parseCsv(text) {
  const lines = String(text).replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  return lines.map(l => {
    const out = [];
    let cur = '', q = false;
    for (let i = 0; i < l.length; i++) {
      const ch = l[i];
      if (q) {
        if (ch === '"' && l[i + 1] === '"') { cur += '"'; i++; }
        else if (ch === '"') q = false;
        else cur += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',') { out.push(cur); cur = ''; }
      else cur += ch;
    }
    out.push(cur);
    return out;
  });
}
function parseHtmlTable(text) {
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const tb = doc.querySelector('table');
  if (!tb) throw new Error('文件里没有表格');
  return Array.from(tb.querySelectorAll('tr')).map(tr =>
    Array.from(tr.querySelectorAll('td,th')).map(td => (td.textContent || '').trim())
  );
}
async function parseSheetFile(file) {
  const nm = (file.name || '').toLowerCase();
  if (nm.endsWith('.csv')) return parseCsv(await file.text());
  if (nm.endsWith('.xlsx')) return await readXlsx(await file.arrayBuffer());
  const txt = await file.text();
  if (txt.indexOf('<table') >= 0) return parseHtmlTable(txt);
  if (nm.endsWith('.xls')) throw new Error('这是老版 .xls 二进制格式，请在 Excel 里另存为 .xlsx 或 CSV 再上传');
  return parseCsv(txt);
}

        tables.forEach(t => {
          out.push(['[' + (doc.title || '未命名') + ']']);

          (t.rows || []).forEach(r => out.push([''].concat(r || [])));
          out.push([]);
        });
      });
      return out;
    },
    apply: grid => {
      const docs = D()[did].docs;
      let curTitle = null, curIdx = 0, curHead = null, curRows = [], done = 0;
      const seen = {};
      const flush = () => {
        if (!curTitle || !curHead) return;
        let doc = docs.find(d => (d.title || '') === curTitle);
        if (!doc) { doc = newDoc(curTitle); doc.blocks = []; docs.push(doc); }
        const tables = (doc.blocks || []).filter(b => b.type === 'table');
        if (tables[curIdx]) { tables[curIdx].head = curHead; tables[curIdx].rows = curRows; }
        else doc.blocks.push({ type: 'table', head: curHead, rows: curRows });
        done++;
        curHead = null; curRows = [];
      };
      for (let i = 1; i < grid.length; i++) {
        const cells = (grid[i] || []).map(x => String(x == null ? '' : x));
        const isEmpty = cells.every(c => c.trim() === '');
        if (isEmpty) {
          if (curHead) { flush(); curTitle = null; curIdx = 0; }
          continue;
        }
        const a = cells[0].trim();
        if (a.charAt(0) === '[' && a.charAt(a.length - 1) === ']') {
          flush();
          curTitle = a.slice(1, -1).trim();
          curIdx = seen[curTitle] || 0;
          seen[curTitle] = curIdx + 1;
          curHead = null; curRows = [];
          continue;
        }
        if (!curTitle) continue;
        if (!curHead) curHead = cells.slice(1);
        else curRows.push(cells.slice(1));
      }
      flush();
      return done;
    }
  };

  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.xlsx,.csv,.xls';

    try {

}

}

/* ---------------- 图片压缩 ---------------- */
function pickImage() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  return new Promise(resolve => {
    inp.onchange = () => {
      const f = inp.files[0];
      if (!f) return resolve(null);
      const img = new Image();
      const url = URL.createObjectURL(f);
      img.onload = () => {
        const max = 1400;
        let w = img.width, h = img.height;
        if (Math.max(w, h) > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    };
    inp.click();
  });
}

function renderDocBlock(b) {
  if (b.type === 'text') {

    if (!head.length && !rows.length) return '';

    return `<table class="ds-tbl"><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;

    return `<figure class="ds-img"><img src="${b.src}" alt=""><figcaption>${esc(b.caption || '')}</figcaption></figure>`;

  ]
};
const rnd = n => Math.floor(Math.random() * n);
const pick = arr => arr[rnd(arr.length)];
const fillN = t => t.replace(/\{n\}/g, String(5 + rnd(30)));
const shuffle = arr => {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
};

function genDevRows() {
  const out = [];
  // 1) 用真实数据打头（如果本年度经营目标已填）
  const cols = p1Cols();
  const yc = cols[0];
  const real = [];
  DB.dict.indicators.forEach(ind => {
    const c = D().p1.cells[ind.name + '|' + yc.y] || {};
    const t = num(c.target), a = num(c.actual);
    if (t === null || a === null || t === 0) return;
    const rate = a / t * 100;
    if (rate < 100) real.push({ ind: ind.name, rate, gap: (100 - rate).toFixed(1) });
  });
  shuffle(real).slice(0, 2).forEach(r => {
    out.push({
      item: r.ind + ' 达成 ' + r.rate.toFixed(1) + '%，低于目标 ' + r.gap + ' 个百分点（' + yc.label + '）',
      cause: pick(DEV_T.cause).replace(/\{n\}/g, String(5 + rnd(30))),
      strategy: pick(DEV_T.strategy)
    });
  });

  // 2) 随机补齐到 4–6 条
  const target = 4 + rnd(3);
  const items = shuffle(DEV_T.item);
  const causes = shuffle(DEV_T.cause);
  const strats = shuffle(DEV_T.strategy);
  let i = 0;
  while (out.length < target && i < items.length) {
    out.push({
      item: fillN(items[i]),
      cause: causes[i % causes.length].replace(/\{n\}/g, String(5 + rnd(30))),
      strategy: strats[i % strats.length]
    });
    i++;
  }
  return out.slice(0, 6);
}

  list.innerHTML = DEV_STEPS.map((s, i) => `<div class="gen-item" data-gs="${i}"><span class="dot">${i + 1}</span><span>${s}</span></div>`).join('');
  bar.style.width = '0';
  box.classList.add('on');

  let i = 0;
  const tick = () => {
    if (i > 0) {
      const prev = list.querySelector(`[data-gs="${i - 1}"]`);
      if (prev) { prev.classList.remove('run'); prev.classList.add('done'); prev.querySelector('.dot').textContent = '✓'; }
    }
    if (i >= DEV_STEPS.length) {
      bar.style.width = '100%';
      setTimeout(() => {
        const rows = genDevRows();
        D().r7.rows = rows;
        save();
        box.classList.remove('on');
        if (titleEl) titleEl.textContent = '智能体正在生成';
        if (subEl) subEl.textContent = '读取配置模板与字典 · 汇总填报数据 · 排版生成';
        renderMain(); renderSide();
        const saved = (D().r7.rows || []).length;
        toast(saved ? ('分析完成，已生成 ' + saved + ' 条偏差，可逐条修改') : '生成失败：当前主体无数据容器');
        if (!saved) console.warn('dev analysis: rows not persisted', DB.currentYear, DB.currentOrg);
      }, 380);
      return;
    }
    const el = list.querySelector(`[data-gs="${i}"]`);
    if (el) el.classList.add('run');
    bar.style.width = ((i + 1) / DEV_STEPS.length * 92) + '%';
    i++;
    setTimeout(tick, 300);
  };
  setTimeout(tick, 240);
}

/* ==========================================================================
   往年 PPT 解析：解压 pptx → 提取文本/表格 → 匹配模块 → 生成差异备注
   ========================================================================== */
const PPT_MODULES = [
  { id: 'p1', keys: ['经营目标', '三年', '回款', '毛利率'] },
  { id: 'p2', keys: ['业绩细分', '细分'] },
  { id: 'p3', keys: ['战略举措', '举措'] },
  { id: 'p4', keys: ['战略分解', '必胜战役'] },
  { id: 'p5', keys: ['指标分解', '关键任务指标'] },
  { id: 'p6', keys: ['业务与增长'] },
  { id: 'r1', keys: ['经营目标复盘', '目标复盘', '复盘'] },
  { id: 'r2', keys: ['业绩细分复盘', '细分复盘'] },
  { id: 'r3', keys: ['战略执行回顾', '执行回顾', '执行情况'] },
  { id: 'r4', keys: ['亮点工作', '创新举措', '亮点'] },
  { id: 'r5', keys: ['市场洞察', '市场机会', '竞争态势'] },
  { id: 'r6', keys: ['业务澄清', '商业模式'] },
  { id: 'r7', keys: ['偏差分析', '差距', '反思'] }
];
const DOC_TARGETS = ['r1', 'r2', 'r4', 'r5', 'r6'];

function byLocal(root, name) {
  const out = [];
  if (!root) return out;
  const start = root.nodeType === 9 ? root.documentElement : root;
  (function walk(el) {
    if (!el || el.nodeType !== 1) return;
    if (el.localName === name) out.push(el);
    const kids = el.children || [];
    for (let i = 0; i < kids.length; i++) walk(kids[i]);
  })(start);
  return out;
}
function textOf(el) {
  return byLocal(el, 't').map(t => t.textContent || '').join('').trim();
}

/* 解析 pptx → [{index, title, texts, tables}] */
async function parsePptx(buf) {
  const files = await unzip(buf instanceof Uint8Array ? buf : new Uint8Array(buf));
  const dec = new TextDecoder();
  const names = Object.keys(files).filter(n => /^ppt\/slides\/slide\d+\.xml$/.test(n));
  names.sort((a, b) => {
    const na = parseInt((a.match(/slide(\d+)/) || [0, 0])[1], 10);
    const nb = parseInt((b.match(/slide(\d+)/) || [0, 0])[1], 10);
    return na - nb;
  });
  if (!names.length) throw new Error('不是有效的 pptx（找不到幻灯片）');
  const out = [];
  names.forEach((n, i) => {
    const doc = new DOMParser().parseFromString(dec.decode(files[n]), 'text/xml');
    const sps = byLocal(doc, 'sp');
    const texts = [];
    sps.forEach(sp => {
      const t = textOf(sp);
      if (t) texts.push(t);
    });
    const tables = [];
    byLocal(doc, 'tbl').forEach(tb => {
      const rows = [];
      byLocal(tb, 'tr').forEach(tr => {
        const cells = byLocal(tr, 'tc').map(tc => textOf(tc));
        if (cells.some(c => c !== '')) rows.push(cells);
      });
      if (rows.length) tables.push(rows);
    });
    out.push({
      index: i + 1,
      title: texts[0] || ('第 ' + (i + 1) + ' 页'),
      texts,
      tables
    });
  });
  return out;
}

/* 标题 → 模块 */
function matchModule(title, texts) {
  const hay = (title + ' ' + (texts || []).join(' ')).slice(0, 200);
  let best = null, bestLen = 0;
  PPT_MODULES.forEach(m => {
    m.keys.forEach(k => {
      if (hay.indexOf(k) >= 0 && k.length > bestLen) { best = m.id; bestLen = k.length; }
    });
  });
  return best;
}

/* 把解析结果写入当前年度的对应模块 */
function applyPptx(slides, fileName) {
  const log = [];
  let filled = 0, skipped = 0;
  slides.forEach(sl => {
    const mod = matchModule(sl.title, sl.texts);
    if (!mod) {
      skipped++;
      log.push({ page: sl.index, title: sl.title, type: 'unmatched', note: '未识别到对应模块，建议人工判断归属' });
      return;
    }
    const tpl = DB.templates[mod];
    if (!tpl) { skipped++; return; }
    if (DOC_TARGETS.indexOf(mod) >= 0) {
      // 文档类：整页变成一篇文档
      const blocks = [];
      const bodyTexts = sl.texts.filter((t, i) => i > 0 && t.length > 1);
      if (bodyTexts.length) blocks.push({ type: 'text', html: '<p>' + bodyTexts.join('</p><p>') + '</p>' });
      sl.tables.forEach(tb => {
        const head = tb[0] || [];
        const rows = tb.slice(1).filter(r => r.some(c => String(c || '').trim()));
        if (head.length) blocks.push({ type: 'table', head, rows });
      });
      if (!blocks.length) {
        skipped++;
        log.push({ page: sl.index, title: sl.title, type: 'empty', note: '识别到「' + tpl.title + '」，但该页没有可用内容' });
        return;
      }
      const bucket = D()[mod];
      bucket.docs = bucket.docs || [];
      bucket.docs.push({
        id: 'd' + Date.now().toString(36) + sl.index,
        title: (sl.title || tpl.title).slice(0, 60),
        blocks
      });
      filled++;
      log.push({ page: sl.index, title: sl.title, type: 'doc', note: '已生成「' + tpl.title + '」的第 ' + bucket.docs.length + ' 篇文档（' + blocks.length + ' 个内容块）' });
      return;
    }
    // 表结构页（p1-p6 / r3 / r7）：只记录，不自动写
    skipped++;
    log.push({
      page: sl.index, title: sl.title, type: 'table',
      note: '匹配「' + tpl.title + '」为表格式模块，未自动填入，请对照本页内容手工录入'
    });
  });
  save();
  return { log, filled, skipped, total: slides.length, fileName };
}

/* 生成差异备注（Markdown） */
function buildPptNote(res) {
  const L = [];
  L.push('# 往年规划 PPT 解析备注');
  L.push('');
  L.push('- 源文件：' + (res.fileName || '—'));
  L.push('- 解析时间：' + new Date().toLocaleString('zh-CN'));
  L.push('- 目标年度：' + DB.currentYear + ' / 填报主体：' + ((orgById(DB.currentOrg) || {}).name || '—'));
  L.push('- 共 ' + res.total + ' 页，已填入 ' + res.filled + ' 页，需人工处理 ' + res.skipped + ' 页');
  L.push('');
  L.push('## 逐页处理结果');
  L.push('');
  L.push('| 页码 | 页面标题 | 结果 | 说明 |');
  L.push('| --- | --- | --- | --- |');
  res.log.forEach(r => {
    const t = { doc: '已填入', table: '需手工', empty: '空页', unmatched: '未识别' }[r.type] || r.type;
    L.push('| ' + r.page + ' | ' + String(r.title).replace(/\|/g, '／').slice(0, 40) + ' | ' + t + ' | ' + r.note + ' |');
  });
  L.push('');
  L.push('## 人工核对清单');
  L.push('');
  L.push('1. 「已填入」的页请打开对应模块逐段核对，PPT 里的图片、SmartArt 图形不会被解析。');
  L.push('2. 「需手工」的页属于表格式模块（三一规划 6 页 / 战略执行回顾 / 偏差分析），需对照 PPT 手工录入或下载模板填写后上传。');
  L.push('3. 「未识别」的页建议先判断它属于哪个模块，再手工补录或重命名页标题后重新导入。');
  L.push('4. 导入只影响当前年度、当前主体，不会覆盖其他数据。');
  return L.join('\n');
}

function downloadText(name, text) {
  const blob = new Blob(['\uFEFF' + text], { type: 'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
}

function importPptx() {
  const inp = document.createElement('input');
  inp.type = 'file';

    const f = inp.files[0];
    if (!f) return;
    toast('正在解析 ' + f.name + ' …');
    try {
      const slides = await parsePptx(await f.arrayBuffer());
      const res = applyPptx(slides, f.name);
      const note = buildPptNote(res);
      lastPptNote = note;
      renderSide();
      renderMain();
      const mmd = res.skipped ? ('，' + res.skipped + ' 页需人工处理') : '';
      toast('解析完成：' + res.filled + ' 页已填入' + mmd);
      if (confirm('解析完成：共 ' + res.total + ' 页\n已填入 ' + res.filled + ' 页' + mmd +
        '\n\n是否立即下载「解析备注」？')) {
        downloadText('往年规划解析备注-' + DB.currentYear + '-' + f.name.replace(/\.pptx$/i, '') + '.md', note);
      }

      alert('解析失败：' + (e && e.message ? e.message : e) +
        '\n\n仅支持 .pptx（PowerPoint 2007 及以上）。老版 .ppt 请先另存为 .pptx。');
    }
  };
  inp.click();
}

/* ==========================================================================
   PPT 渲染引擎：6 页数据图 + 封面
   ========================================================================== */
function fcell(v, unit) {
  if (v === '' || v === null || v === undefined) return '';
  const raw = String(v).trim();
  if (!raw) return '';
  const n = num(raw);
  if (n === null) return esc(raw);
  if (unit === '%' || raw.indexOf('%') >= 0) {
    return (Math.round(n) === n ? n.toFixed(0) : n.toFixed(1)) + '%';
  }
  return n.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
}
function unitOf(indName) {
  const d = DB.dict.indicators.find(x => x.name === indName);
  return d ? (d.unit || '') : '';
}
function shell(id, inner) {

    });
    if (!items.length) return;
    items.forEach((it, i) => {
      const r = D().p2.rows[g.name + '|' + it] || {};
      const grow = (num(r.next) !== null && num(r.cur) !== null) ? num(r.next) - num(r.cur) : null;

/* ---------- 自适应缩放 ---------- */
function fitInner(root) {
  root.querySelectorAll('.sd-main').forEach(main => {
    const fit = main.querySelector('.fit');
    if (!fit) return;
    fit.style.transform = 'none';
    const avail = main.clientHeight;
    const need = fit.scrollHeight;
    if (avail > 0 && need > avail + 2) {
      const s = Math.max(0.5, avail / need);
      fit.style.transform = `scale(${s})`;
    }
  });
}
function fitBoxes(scope) {
  (scope || document).querySelectorAll('.slide-box[data-fit]').forEach(box => {
    const inner = box.querySelector('.slide-inner');
    if (!inner) return;
    const w = box.clientWidth || 320;
    const s = w / 1280;
    inner.style.transform = `scale(${s})`;
    fitInner(inner);
  });
}

let PL = { list: [], i: 0, on: false };
/* 正文页：规划 6 页 + 回顾（文档页按篇展开）+ 执行回顾 */
function buildBodySlides(opt) {
  SLIDE_OPT = opt || {};
  const arr = [];
  ALL_PAGES.forEach(id => {
    if (!DB.templates[id]) return;
    if (DOC_PAGES.indexOf(id) >= 0) {
      const docs = D()[id].docs || [];
      if (!docs.length) {
        arr.push({ name: DB.templates[id].title, html: renderSlide(id, opt) });
        return;
      }
      docs.forEach((doc, i) => {
        arr.push({ name: doc.title || DB.templates[id].title, html: renderDocSlide(id, doc, i, docs.length) });
      });
      return;
    }
    arr.push({ name: DB.templates[id].title, html: renderSlide(id, opt) });
  });
  return arr;
}
function buildSlides() {
  const arr = [];
  if (DB.meta.showCover) arr.push({ name: '封面', html: renderCover() });
  buildBodySlides({}).forEach(s => arr.push(s));
  return arr;
}
function openPlayer(index, list, title) {
  PL.list = list || buildSlides();
  PL.i = Math.max(0, Math.min(index || 0, PL.list.length - 1));
  PL.on = true;
  $('#player').classList.add('on');
  $('#plTitle').textContent = title || DB.meta.title;
  $('#plSub').textContent = list ? '多主体合并版本' : (DB.meta.company + ' · ' + DB.meta.dept);
  $('#plMeta').textContent = PL.list.length + ' 页 · 16:9';
  paintPlayer();
}
function closePlayer() {
  PL.on = false;
  $('#player').classList.remove('on');
}
function paintPlayer() {
  const s0 = PL.list[PL.i];
  const wrap = $('#plSlideWrap');
  wrap.innerHTML = `<div class="slide-inner">${s0.html}</div>`;
  const stage = $('.pl-stage');
  const availW = Math.max(320, stage.clientWidth - 130);
  const availH = Math.max(200, stage.clientHeight - 30);
  const s = Math.min(availW / 1280, availH / 720);
  wrap.style.width = (1280 * s) + 'px';
  wrap.style.height = (720 * s) + 'px';
  const inner = wrap.querySelector('.slide-inner');
  inner.style.width = '1280px';
  inner.style.height = '720px';
  inner.style.transform = `scale(${s})`;
  fitInner(inner);
  $('#plNum').textContent = (PL.i + 1) + ' / ' + PL.list.length;
  $('#plPrev').disabled = PL.i === 0;
  $('#plNext').disabled = PL.i === PL.list.length - 1;
  $('#plProg').style.width = ((PL.i + 1) / PL.list.length * 100) + '%';
  let dots = '';
  PL.list.forEach((p, i) => { dots += `<i class="${i === PL.i ? 'on' : ''}" data-dot="${i}"></i>`; });
  $('#plDots').innerHTML = dots;
}
function stepPlayer(d) {
  const n = PL.i + d;
  if (n < 0 || n >= PL.list.length) return;
  PL.i = n;
  paintPlayer();
}

/* ---------- 生成动画 ---------- */
const GEN_STEPS = [
  '读取模板配置（6 页 / 字段定义）',
  '加载字典（年份、指标、维度、部门）',
  '校验各页必填项完成度',
  '计算派生指标（达成率 / 增长额 / 增长率）',
  '排版 P1–P3：经营目标 · 业绩细分 · 战略举措',
  '排版 P4–P6：战略分解 · 指标分解 · 业务与增长',
  '合成封面、页脚与页码'
];
function runGenerate() {
  const box = $('#gen');
  const list = $('#genList');
  const bar = $('#genBar');
  list.innerHTML = GEN_STEPS.map((s, i) => `<div class="gen-item" data-gs="${i}"><span class="dot">${i + 1}</span><span>${s}</span></div>`).join('');
  bar.style.width = '0';
  box.classList.add('on');
  let i = 0;
  const tick = () => {
    if (i > 0) {
      const prev = list.querySelector(`[data-gs="${i - 1}"]`);
      if (prev) { prev.classList.remove('run'); prev.classList.add('done'); prev.querySelector('.dot').textContent = '✓'; }
    }
    if (i >= GEN_STEPS.length) {
      bar.style.width = '100%';
      setTimeout(() => {
        box.classList.remove('on');
        openPlayer(0);
      }, 420);
      return;
    }
    const el = list.querySelector(`[data-gs="${i}"]`);
    if (el) { el.classList.add('run'); }
    bar.style.width = ((i + 1) / GEN_STEPS.length * 92) + '%';
    i++;
    setTimeout(tick, 340);
  };
  setTimeout(tick, 260);
}
