/* ---------- 输入：填写页 ---------- */
function updateP1Calc(ind, y) {
  const c = D().p1.cells[ind + '|' + y] || {};
  const el = document.querySelector(`[data-calc="p1|${ind}|${y}"]`);
  if (el) el.textContent = pct(c.actual, c.target) || '—';
}
function updateP2Calc(g, i) {
  const r = D().p2.rows[g + '|' + i] || {};
  const grow = (num(r.next) !== null && num(r.cur) !== null) ? num(r.next) - num(r.cur) : null;
  const rate = (grow !== null && num(r.cur)) ? (grow / num(r.cur) * 100).toFixed(1) + '%' : '';
  const ge = document.querySelector(`[data-calc="p2|${g}|${i}|g"]`);
  const re = document.querySelector(`[data-calc="p2|${g}|${i}|r"]`);
  if (ge) { ge.textContent = grow === null ? '—' : fmt(grow); ge.classList.toggle('blank', grow === null); }
  if (re) { re.textContent = rate || '—'; re.classList.toggle('blank', !rate); }
  const grp = DB.dict.dims.find(x => x.name === g);
  if (grp) {
    const s = p2Sub(grp);
    const set = (suffix, v, blank) => {
      const e = document.querySelector(`[data-calc="p2sub|${g}|${suffix}"]`);
      if (e) { e.textContent = blank ? '—' : v; }
    };
    set('qty', fmt(s.qty), !s.qty);
    set('cur', fmt(s.cur), !s.cur);
    set('next', fmt(s.next), !s.next);
    set('g', fmt(s.next - s.cur), !(s.next && s.cur));
    set('r', ((s.next - s.cur) / s.cur * 100).toFixed(1) + '%', !(s.next && s.cur));
  }
}
function updateR1Calc(ind) {
  const r = D().r1.rows[ind] || {};
  const e1 = document.querySelector(`[data-calc="r1|${ind}|rate"]`);
  if (e1) e1.textContent = pct(r.pa, r.pt) || '—';
  const e2 = document.querySelector(`[data-calc="r1|${ind}|yoy"]`);
  if (e2) e2.textContent = yoyOf(r.ca, r.pa);
}
function updateR2Calc(g, i) {
  const r = D().r2.rows[g + '|' + i] || {};
  const dq = (num(r.cq) !== null && num(r.pq) !== null) ? num(r.cq) - num(r.pq) : null;
  const e1 = document.querySelector(`[data-calc="r2|${g}|${i}|dq"]`);
  if (e1) { e1.textContent = dq === null ? '—' : (dq > 0 ? '+' : '') + fmt(dq); e1.classList.toggle('blank', dq === null); }
  const e2 = document.querySelector(`[data-calc="r2|${g}|${i}|dy"]`);
  if (e2) e2.textContent = yoyOf(r.ca, r.pa);
  const grp = DB.dict.dims.find(x => x.name === g);
  if (grp) {
    const s = r2Sub(grp);
    const put = (suf, val, blank) => {
      const e = document.querySelector(`[data-calc="r2sub|${g}|${suf}"]`);
      if (e) e.textContent = blank ? '—' : val;
    };
    put('pq', fmt(s.pq), !s.pq); put('pa', fmt(s.pa), !s.pa);
    put('cq', fmt(s.cq), !s.cq); put('ca', fmt(s.ca), !s.ca);
    put('dq', (s.cq - s.pq > 0 ? '+' : '') + fmt(s.cq - s.pq), !(s.cq && s.pq));
    put('dy', yoyOf(s.ca, s.pa), yoyOf(s.ca, s.pa) === '—');
  }
}
function handlePageInput(el) {
  const p = el.dataset.p, k = el.dataset.k, v = el.value;
  if (p === 'p1') {
    const key = el.dataset.ind + '|' + el.dataset.y;
    D().p1.cells[key] = D().p1.cells[key] || { target: '', actual: '', rate: '' };

  } else if (p === 'p2') {

    D().p2.rows[key][k] = v;
    updateP2Calc(el.dataset.g, el.dataset.i);
  } else if (p === 'p3') {
    D().p3.rows[+el.dataset.i][k] = v;
  } else if (p === 'p4') {
    const ii = +el.dataset.ii, bi = el.dataset.bi, ti = el.dataset.ti;
    const it = D().p4.initiatives[ii];
    if (bi === undefined) it[k] = v;
    else if (ti === undefined) it.battles[+bi][k] = v;

  } else if (p === 'p5') {

    r[k] = v;

    }
  } else if (p === 'r1') {
    const ind = el.dataset.ind;

    D().r1.rows[ind][k] = v;

  } else if (p === 'r2') {
    const key = el.dataset.g + '|' + el.dataset.i;
    D().r2.rows[key] = D().r2.rows[key] || { pq: '', pa: '', cq: '', ca: '' };
    D().r2.rows[key][k] = v;
    updateR2Calc(el.dataset.g, el.dataset.i);
  } else if (p === 'r3') {
    D().r3.rows[+el.dataset.i][k] = v;
  } else if (p === 'r4') {
    D().r4.rows[+el.dataset.i][k] = v;
  } else if (p === 'r7') {

/* ---------- 输入：字典 ---------- */
function renameP1(oldN, newN) {
  const cells = D().p1.cells;
  Object.keys(cells).forEach(key => {
    if (key.indexOf(oldN + '|') === 0) {
      cells[newN + key.slice(oldN.length)] = cells[key];
      delete cells[key];
    }
  });
}
function renameP6(oldN, isDir, newN) {
  const rows = D().p6.rows;
  Object.keys(rows).forEach(key => {
    const parts = key.split('|');
    if (isDir && parts[0] === oldN) {
      rows[newN + '|' + parts[1]] = rows[key];
      delete rows[key];
    } else if (!isDir && parts[1] === oldN) {
      rows[parts[0] + '|' + newN] = rows[key];
      delete rows[key];
    }
  });
}
function handleDictInput(el) {
  const k = el.dataset.dict, i = +el.dataset.i, f = el.dataset.f;
  const arr = DB.dict[k];
  if (!arr || !arr[i]) return;
  const item = arr[i];
  if (k === 'years') {
    if (f === 'y') item.y = el.value;
    if (f === 'type') item.type = el.value;
  } else if (k === 'indicators') {
    if (f === 'name') {
      const old = item.name, nv = el.value;
      if (old !== nv && nv) {
        renameP1(old, nv);
        renameP6(old, false, nv);
        D().p5.rows.forEach(r => { if (r.iname === old) r.iname = r.iname; });
        item.name = nv;
      }
    }
    if (f === 'unit') item.unit = el.value;
    if (f === 'hl') item.hl = el.checked;
  } else if (k === 'dims') {
    if (f === 'name') {
      const old = item.name, nv = el.value;
      if (old !== nv && nv) {
        Object.keys(D().p2.rows).forEach(key => {
          if (key.indexOf(old + '|') === 0) {
            D().p2.rows[nv + key.slice(old.length)] = D().p2.rows[key];
            delete D().p2.rows[key];
          }
        });
        item.name = nv;
      }
    }
    if (f === 'items') item.items = el.value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
    if (f === 'sub') item.sub = el.value;
  } else if (k === 'dirs') {
    const old = item, nv = el.value;
    if (old !== nv && nv) {
      renameP6(old, true, nv);
      D().p3.rows.forEach(r => { if (r.dir === old) r.dir = nv; });
      arr[i] = nv;
    }
  } else {
    arr[i] = el.value;
  }
  save();
  renderSide();
}

function doExport() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `三一规划助手-配置与数据-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 JSON');
}
function doImport() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o.templates || !o.dict || !o.data) throw 0;
        DB = o;
        DB.version = 1;
        save();
        updateRoleChip();
        state.view = DB.role === 'admin' ? 'cfg-tpl' : 'overview';
        render();
        toast('导入成功');
      } catch (e) { alert('文件格式不对，需要本工具导出的 JSON'); }
    };
    r.readAsText(f, 'utf-8');
  };
  inp.click();
}

function toTop(){ try{ document.documentElement.scrollTop=0; document.body.scrollTop=0; }catch(e){} }
document.addEventListener('click', e => {
  const el = e.target;

  const fh = el.closest('[data-fold]');
  if (fh) {
    const k = fh.dataset.fold;
    DB.ui = DB.ui || { collapsed: {} };
    DB.ui.collapsed = DB.ui.collapsed || {};
    DB.ui.collapsed[k] = !DB.ui.collapsed[k];
    save();
    renderSide();
    return;
  }

  const ub = el.closest('[data-user]');
  if (ub) { switchUser(ub.dataset.user); return; }

  const nav = el.closest('[data-nav]');
  if (nav) {
    state.view = nav.dataset.nav;
    if (DB.templates[state.view]) state.tab = 'fill';
    render();
    toTop();
    return;
  }
  const tab = el.closest('[data-tab]');
  if (tab) { state.tab = tab.dataset.tab; renderMain(); return; }

  if (el.closest('[data-gen]')) { runGenerate(); return; }
  if (el.closest('#btnGen')) { runGenerate(); return; }
  const op = el.closest('[data-open]');
  if (op) { openPlayer(+op.dataset.open); return; }

  const cfgt = el.closest('[data-cfgtpl]');
  if (cfgt) { state.cfgTpl = cfgt.dataset.cfgtpl; renderMain(); return; }
  const cfgd = el.closest('[data-cfgdict]');
  if (cfgd) { state.cfgDict = cfgd.dataset.cfgdict; renderMain(); return; }

  const add = el.closest('[data-add]');
  if (add) { addRow(add.dataset.add, add); return; }
  const dlt = el.closest('[data-del]');
  if (dlt) { delRow(dlt.dataset.del, dlt); return; }

  const da = el.closest('[data-dictadd]');
  if (da) { dictAdd(da.dataset.dictadd); return; }
  const dd = el.closest('[data-dictdel]');
  if (dd) { dictDel(dd.dataset.dictdel, +dd.dataset.i); return; }

  /* ---- 文档页 ---- */
  const curDoc = () => (DOC_PAGES.indexOf(state.view) >= 0) ? state.view : null;
  if (el.hasAttribute('data-docadd')) {
    const pid = el.dataset.docadd;
    const arr = D()[pid].docs;
    arr.push(newDoc(DB.templates[pid].title + (arr.length + 1)));
    save(); renderMain();
    toast('已新增第 ' + arr.length + ' 页文档');
    return;
  }
  const ddel = el.closest('[data-docdel]');
  if (ddel) {
    const pid = curDoc(); if (!pid) return;
    if (!confirm('删除这一篇文档？它对应的 PPT 页也会一起删掉。')) return;
    D()[pid].docs.splice(+ddel.dataset.docdel, 1);
    save(); renderMain(); return;
  }
  const dmv = el.closest('[data-docmove]');
  if (dmv) {
    const pid = curDoc(); if (!pid) return;
    const arr = D()[pid].docs, i = +dmv.dataset.i;
    const j = dmv.dataset.docmove === 'up' ? i - 1 : i + 1;
    if (j < 0 || j >= arr.length) return;
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    save(); renderMain(); return;
  }
  const badd = el.closest('[data-blockadd]');
  if (badd) {
    const pid = curDoc(); if (!pid) return;
    const doc = D()[pid].docs[+badd.dataset.i];
    if (!doc) return;
    const type = badd.dataset.blockadd;
    if (type === 'text') doc.blocks.push({ type: 'text', html: '' });
    else if (type === 'table') doc.blocks.push({ type: 'table', head: ['列 1', '列 2', '列 3'], rows: [['', '', ''], ['', '', '']] });
    else if (type === 'image') {
      pickImage().then(src => {
        if (!src) return;
        doc.blocks.push({ type: 'image', src, caption: '' });
        save(); renderMain();
        toast('图片已插入（自动压缩到 1400px）');
      });
      return;
    }
    save(); renderMain(); return;
  }
  const bdel = el.closest('[data-blockdel]');
  if (bdel) {
    const pid = curDoc(); if (!pid) return;
    const doc = D()[pid].docs[+bdel.dataset.blockdel];
    if (doc) doc.blocks.splice(+bdel.dataset.b, 1);
    save(); renderMain(); return;
  }
  const ta = el.closest('[data-tbladd]');
  if (ta) {
    const pid = curDoc(); if (!pid) return;
    const b = D()[pid].docs[+ta.dataset.i].blocks[+ta.dataset.b];
    if (!b) return;
    if (ta.dataset.tbladd === 'row') b.rows.push(b.head.map(() => ''));
    else { b.head.push('列 ' + (b.head.length + 1)); b.rows.forEach(r => r.push('')); }
    save(); renderMain(); return;
  }
  const td = el.closest('[data-tbldel]');
  if (td) {
    const pid = curDoc(); if (!pid) return;
    const b = D()[pid].docs[+td.dataset.i].blocks[+td.dataset.b];
    if (!b) return;
    if (td.dataset.tbldel === 'row') {
      if (b.rows.length <= 1) { toast('至少保留一行'); return; }
      b.rows.pop();
    } else {
      if (b.head.length <= 1) { toast('至少保留一列'); return; }
      b.head.pop(); b.rows.forEach(r => r.pop());
    }
    save(); renderMain(); return;
  }
  const ip = el.closest('[data-imgpick]');
  if (ip) {
    const pid = curDoc(); if (!pid) return;
    const b = D()[pid].docs[+ip.dataset.i].blocks[+ip.dataset.b];
    pickImage().then(src => {
      if (!src) return;
      b.src = src; save(); renderMain();
    });
    return;
  }

  if (el.closest('[data-ycsave]')) { closeYearCfg(true); return; }
  if (el.closest('[data-ycclose]')) { closeYearCfg(false); return; }
  const yc = el.closest('[data-yearcfg]');
  if (yc) { openYearCfg(yc.dataset.yearcfg); return; }
  if (el.hasAttribute('data-ycadd')) { yearCfgAdd(); return; }
  const ycd = el.closest('[data-ycdel]');
  if (ycd) { yearCfgDel(+ycd.dataset.ycdel); return; }
  const xls = el.closest('[data-xls]');
  if (xls) { exportSheet(xls.dataset.xls); return; }
  const xup = el.closest('[data-xlsup]');
  if (xup) { importSheet(xup.dataset.xlsup); return; }
  if (el.closest('[data-submit]')) { doSubmit(); return; }
  if (el.closest('[data-withdraw]')) { doWithdraw(); return; }
  if (el.closest('[data-summary]')) { openSummary(state.reviewSel.slice()); return; }
  if (el.closest('[data-analyze]')) { runDevAnalysis(); return; }
  if (el.closest('[data-importppt]')) { importPptx(); return; }
  if (el.closest('[data-pptnote]')) { downloadText('往年规划解析备注-' + DB.currentYear + '.md', lastPptNote); return; }
  const sy = el.closest('[data-setyear]');
  if (sy) { switchYear(sy.dataset.setyear); return; }
  if (el.hasAttribute('data-yearadd')) { yearAdd(el.dataset.yearadd === '1'); return; }
  if (el.hasAttribute('data-yeardel')) { yearDel(); return; }

  if (el.hasAttribute('data-useradd')) { userAdd(); return; }
  const ud = el.closest('[data-userdel]');
  if (ud) { userDel(ud.dataset.userdel); return; }
  if (el.hasAttribute('data-orgadd')) { orgAdd(el.dataset.orgadd); return; }
  if (el.hasAttribute('data-orgdel')) { orgDel(el.dataset.orgdel); return; }
  const pv = el.closest('[data-preview]');
  if (pv) { previewOrg(pv.dataset.preview); return; }
  const gt = el.closest('[data-goto]');
  if (gt) {
    DB.currentOrg = gt.dataset.goto;
    state.view = 'overview'; state.tab = 'fill';
    save(); render();
    toast('已切换到 ' + ((orgById(DB.currentOrg) || {}).name || ''));
    return;
  }
  const rt = el.closest('[data-return]');
  if (rt) { doReturn(rt.dataset.return); return; }
  const sel = el.closest('[data-selorg]');
  if (sel) {
    const id = sel.dataset.selorg;
    const i = state.reviewSel.indexOf(id);
    if (i >= 0) state.reviewSel.splice(i, 1); else state.reviewSel.push(id);
    renderMain();
    return;
  }

  if (el.closest('[data-export]')) { doExport(); return; }
  if (el.closest('[data-import]')) { doImport(); return; }
  if (el.closest('[data-reset]')) { doReset(); return; }

  const dot = el.closest('[data-dot]');
  if (dot) { PL.i = +dot.dataset.dot; paintPlayer(); return; }
  if (el.closest('#plClose')) { closePlayer(); return; }
  if (el.closest('#plPrev')) { stepPlayer(-1); return; }
  if (el.closest('#plNext')) { stepPlayer(1); return; }
  if (el.closest('#plPrint')) { doPrint(); return; }
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.p) handlePageInput(el);
  else if (el.hasAttribute('data-docf')) {
    const pid = (DOC_PAGES.indexOf(state.view) >= 0) ? state.view : null;
    if (pid) { D()[pid].docs[+el.dataset.docf].title = el.value; touch(); }
  } else if (el.hasAttribute('data-btext')) {
    const pid = (DOC_PAGES.indexOf(state.view) >= 0) ? state.view : null;
    if (pid) {
      const doc = D()[pid].docs[+el.dataset.btext];
      if (doc && doc.blocks[+el.dataset.b]) { doc.blocks[+el.dataset.b].html = el.innerHTML; touch(); }
    }
  } else if (el.hasAttribute('data-bcell')) {
    const pid = (DOC_PAGES.indexOf(state.view) >= 0) ? state.view : null;
    if (pid) {
      const doc = D()[pid].docs[+el.dataset.doc];
      const b = doc && doc.blocks[+el.dataset.b];
      if (b) {
        if (el.dataset.bcell === 'h') b.head[+el.dataset.c] = el.value;
        else b.rows[+el.dataset.r][+el.dataset.c] = el.value;
        touch();
      }
    }
  } else if (el.hasAttribute('data-bcap')) {
    const pid = (DOC_PAGES.indexOf(state.view) >= 0) ? state.view : null;
    if (pid) {
      const doc = D()[pid].docs[+el.dataset.bcap];
      if (doc && doc.blocks[+el.dataset.b]) { doc.blocks[+el.dataset.b].caption = el.value; touch(); }
    }
  } else if (el.hasAttribute('data-yc')) yearCfgInput(el);
  else if (el.dataset.userf) handleUserInput(el);
  else if (el.dataset.org) handleOrgInput(el);
  else if (el.dataset.tplf) handleTplInput(el);
  else if (el.dataset.dict) handleDictInput(el);
  else if (el.dataset.meta) handleMetaInput(el);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.tagName === 'SELECT' && el.dataset.p) handlePageInput(el);
  else if (el.tagName === 'SELECT' && el.dataset.dict) handleDictInput(el);
  else if (el.type === 'checkbox' && el.dataset.tplf) handleTplInput(el);
  else if (el.type === 'checkbox' && el.dataset.dict) handleDictInput(el);
  else if (el.type === 'checkbox' && el.dataset.meta) handleMetaInput(el);
  else if (el.dataset.org) handleOrgInput(el);
  else if (el.dataset.userf) handleUserInput(el);
  else if (el.id === 'orgPick') {
    DB.currentOrg = el.value;
    state.view = 'overview'; state.tab = 'fill';
    save(); render();
  }
});

$('#yearModal').addEventListener('click', e => {
  if (e.target.id === 'yearModal') closeYearCfg(false);
});
document.addEventListener('click', e => {
  if (e.target && e.target.closest && e.target.closest('#btnSubmit')) doSubmit();
});
document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'yearPick') return;
  const v = e.target.value;
  if (v === '__add') {
    e.target.value = DB.currentYear;
    yearAdd(false);
    return;
  }
  switchYear(v);
});
$('#userBtn').addEventListener('click', e => {
  e.stopPropagation();
  $('#userPop').classList.toggle('on');
});
document.addEventListener('click', e => {
  const pop = $('#userPop');
  if (!pop || !pop.classList.contains('on')) return;
  if (!e.target.closest('#userPop') && !e.target.closest('#userBtn')) pop.classList.remove('on');
});

$('#roleSwitch').addEventListener('click', e => {
  const b = e.target.closest('button[data-role]');
  if (!b) return;
  DB.role = b.dataset.role;
  const cand = DB.users.find(u => (u.admin ? 'admin' : 'user') === DB.role);
  if (cand) {
    DB.me = cand.id;
    if (!cand.admin && cand.orgId) DB.currentOrg = cand.orgId;
  }
  save();
  updateRoleChip();
  state.view = DB.role === 'admin' ? 'cfg-tpl' : 'overview';
  state.tab = 'fill';
  render();
  toTop();
});

document.addEventListener('keydown', e => {
  if (!PL.on) return;
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); stepPlayer(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); stepPlayer(-1); }
  if (e.key === 'Escape') closePlayer();
});

let rz;
window.addEventListener('resize', () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    fitBoxes($('#main'));
    if (PL.on) paintPlayer();
  }, 160);
});

/* ---------- init ---------- */
const _mu = meUser();
if (DB.role === 'user' && _mu.orgId) DB.currentOrg = _mu.orgId;
if (!DB.currentOrg || !orgById(DB.currentOrg)) DB.currentOrg = (DB.orgs[0] || {}).id || '';
updateRoleChip();
state.view = DB.role === 'admin' ? 'cfg-tpl' : 'overview';
render();

</script>
</body>
</html>
