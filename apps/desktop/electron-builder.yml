appId: com.kla.workstation
productName: KLA Workstation
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
asar: true
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
