appId: com.kla.workstation
productName: KLA Workstation
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
asar: true
extraResources:
  - from: resources/skills/deck-agent-kit
    to: skills/deck-agent-kit
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
