appId: com.kunqing.workstation
productName: 鲲擎智能体集成工作站
directories:
  output: D:/temp/kunqing-release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
