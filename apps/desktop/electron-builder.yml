appId: com.kla.workstation
productName: KLA Workstation
directories:
  output: release
files:
  - dist/**/*
  - desktop/**/*
  - package.json
asar: true
extraResources:
  - from: resources/client-config.json
    to: client-config.json
  - from: resources/skills/deck-agent-kit
    to: skills/deck-agent-kit
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: resources/skills/kunlu-business-planner
    to: skills/kunlu-business-planner
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
  - from: resources/skills/code-analysis-kit
    to: skills/code-analysis-kit
    filter:
      - '**/*'
      - '!**/__pycache__/**'
      - '!**/*.pyc'
win:
  icon: resources/kla-app-icon.ico
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
