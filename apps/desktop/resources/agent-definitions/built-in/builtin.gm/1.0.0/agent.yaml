schemaVersion: 1
id: builtin.gm
version: 1.0.0
displayName: GM智能体
runtime: native-model
framework: gm-planner
entry: planHomeRequest
defaultModelSlot: fast
modelRequirements:
  - structuredOutput
skills:
  - group-composition
tools:
  - system.listAgentProfiles
  - system.createProject
  - system.configureProjectMembers
maxPermissions:
  read:
    - system.projects
    - system.agent-profiles
    - system.settings
    - group.original-files
    - group.knowledge
    - shared.knowledge
    - group.messages
  write:
    - system.projects
    - system.project-members
    - system.project-names
    - system.plans
  administer:
    - projects.create
    - projects.configure
    - agents.select
  network: model-gateway-only
  shell: deny
memoryPolicy:
  shortTermTtlHours: 0
  longTermWrite: deny
