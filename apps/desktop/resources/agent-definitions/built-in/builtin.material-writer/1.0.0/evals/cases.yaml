cases:
  - name: follows-template-before-writing
    input: "依据给出的制度证据和模板说明编写接待方案"
    expected:
      outlineFirst: true
      usesTemplate: true
      writesReviewDraft: true
      publishesFinalArtifact: false
  - name: designs-outline-without-template
    input: "知识管理智能体确认没有模板，请整理一份调研报告"
    expected:
      outlineFirst: true
      designsStructure: true
      writesReviewDraft: true

