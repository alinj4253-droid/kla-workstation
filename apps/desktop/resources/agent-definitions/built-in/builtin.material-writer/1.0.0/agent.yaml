schemaVersion: 1
id: builtin.material-writer
version: 1.0.0
displayName: 材料编写智能体
runtime: native-model
framework: loop-engine
entry: nativeAgentLoop
defaultModelSlot: reasoning
modelRequirements:
  - streaming
  - toolCalling
  - structuredOutput
skills:
  - retrieve-knowledge
  - document-authoring
tools:
  - skill.search
  - skill.load
  - knowledge.search
  - knowledge.readDocument
  - template.list
  - template.read
  - template.materialize
  - workspace.read
  - temp.save
  - temp.read
  - temp.list
  - memory.writeOwn
memoryPolicy:
  shortTermTtlHours: 72
  longTermWrite: candidate-then-commit
