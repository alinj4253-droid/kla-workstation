schemaVersion: 1
id: builtin.orchestrator
version: 1.0.0
displayName: 统筹管理智能体
runtime: native-model
framework: langgraph-js
entry: orchestratorGraph
defaultModelSlot: reasoning
modelRequirements:
  - streaming
  - toolCalling
  - structuredOutput
skills:
  - team-planning
  - result-synthesis
tools:
  - team.listAgents
  - team.delegateTasks
  - workspace.search
  - workspace.read
  - knowledge.search
  - artifact.publish
  - temp.save
  - temp.read
  - temp.list
  - temp.promote
  - memory.writeOwn
maxPermissions:
  read:
    - group.original-files
    - group.knowledge
    - shared.knowledge
    - group.messages
    - group.temp
  write:
    - self.memory
    - group.outputs
    - group.temp
  network: model-gateway-only
  shell: deny
memoryPolicy:
  shortTermTtlHours: 72
  longTermWrite: candidate-then-commit
